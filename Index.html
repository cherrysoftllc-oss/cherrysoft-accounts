<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherrySoft Accounts Pro</title>
  
  <!-- AUDITED STABLE LIBRARIES -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #0b0e14; --surface: #161922; --surface-alt: #1f232d;
      --border: #2d333f; --accent: #6366f1; --text: #f1f5f9;
      --text-muted: #94a3b8; --green: #10b981; --red: #ef4444; --amber: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.5; overflow: hidden; }
    #root { height: 100vh; width: 100vw; display: flex; }
    
    /* Sidebar */
    .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .nav-header { padding: 20px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.2); }
    .nav-section { padding: 15px 20px 5px; font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .nav-item { padding: 10px 20px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; gap: 10px; transition: 0.1s; }
    .nav-item:hover { background: var(--surface-alt); color: var(--text); }
    .nav-item.active { background: var(--accent); color: white; font-weight: 600; }

    /* Main Area */
    .main-content { flex: 1; overflow-y: auto; padding: 25px; height: 100vh; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    
    /* Tables */
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; padding: 12px 10px; color: var(--text-muted); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    
    /* Inputs & Buttons */
    input, select { background: var(--surface-alt); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 8px; width: 100%; }
    button { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    
    /* KPIs */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .kpi-card { background: var(--surface-alt); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .kpi-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-val { font-size: 18px; font-weight: 700; }

    /* Diagnosis Styles */
    .diag-box { padding: 40px; text-align: center; width: 100%; }
    .status-badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; margin-left: 10px; }
  </style>
</head>
<body>
  <div id="root">
    <div class="diag-box">
      <h2 style="color: var(--amber)">Checking System Integrity...</h2>
      <p style="margin-top:10px" id="diag-msg">If this page stays here, your browser is blocking the application scripts.</p>
    </div>
  </div>

  <script>
    // --- AUDIT: AUTOMATIC RECOVERY ---
    window.onerror = function(m, u, l) {
        document.getElementById('root').innerHTML = `<div class="diag-box"><h2 style="color:var(--red)">Engine Error</h2><p>${m}</p><p>Line: ${l}</p><button onclick="location.reload()" style="margin-top:20px; background:var(--accent); color:white; padding:10px;">Restart App</button></div>`;
    };

    if (!window.React) {
        document.getElementById('diag-msg').innerHTML = "<b style='color:var(--red)'>404 ERROR:</b> Could not load React. Check internet or firewall.";
    }

    // --- APP START ---
    const { useState, useEffect, useMemo, useCallback } = React;
    const e = React.createElement;

    const DEFAULT_COA = [
        {name:"Revenue", type:"Income"}, {name:"Purchases", type:"Expense"},
        {name:"Bank Account", type:"Asset", sub:"Cash & Bank"}, {name:"Petty Cash", type:"Asset", sub:"Cash & Bank"},
        {name:"Accounts Receivable", type:"Asset"}, {name:"Accounts Payable", type:"Liability"},
        {name:"Suspense", type:"Asset"}
    ];

    function App() {
        // Multi-Company State
        const [activeCompany, setActiveCompany] = useState(null);
        const [companies, setCompanies] = useState([]);
        const [page, setPage] = useState("dashboard");

        // Data State
        const [txns, setTxns] = useState([]);
        const [invoices, setInvoices] = useState([]);
        const [coa, setCoa] = useState(DEFAULT_COA);

        // --- MULTI-COMPANY HANDLERS ---
        useEffect(() => {
            const idx = localStorage.getItem("cp_index_v5");
            if (idx) setCompanies(JSON.parse(idx));
        }, []);

        const saveBooks = useCallback(() => {
            if (!activeCompany) return;
            const data = { txns, invoices, coa };
            localStorage.setItem(`cp_data_${activeCompany.slug}`, JSON.stringify(data));
            localStorage.setItem("cp_index_v5", JSON.stringify(companies));
            console.log("Real-time save successful");
        }, [txns, invoices, coa, activeCompany, companies]);

        useEffect(() => {
            const timer = setTimeout(saveBooks, 1000);
            return () => clearTimeout(timer);
        }, [saveBooks]);

        const loadCompany = (co) => {
            const raw = localStorage.getItem(`cp_data_${co.slug}`);
            if (raw) {
                const d = JSON.parse(raw);
                setTxns(d.txns || []);
                setInvoices(d.invoices || []);
                setCoa(d.coa || DEFAULT_COA);
            } else {
                setTxns([]); setInvoices([]); setCoa(DEFAULT_COA);
            }
            setActiveCompany(co);
            setPage("dashboard");
        };

        const createCompany = (name) => {
            if (!name.trim()) return;
            const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const newCo = { name, slug, id: Date.now() };
            setCompanies([...companies, newCo]);
            loadCompany(newCo);
        };

        // --- MATH ENGINE ---
        const stats = useMemo(() => {
            const income = invoices.reduce((s, i) => s + (parseFloat(i.amount) || 0), 0);
            const expense = txns.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
            const ar = invoices.reduce((s, i) => s + ((parseFloat(i.amount)||0) - (parseFloat(i.paid)||0)), 0);
            const bank = txns.reduce((s, t) => s + t.amount, 0);
            return { income, expense, net: income - expense, ar, bank };
        }, [txns, invoices]);

        // --- PAGE VIEWS ---
        const Dashboard = () => e("div", null,
            e("div", { className: "kpi-grid" },
                e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Net Profit"), e("div", { className: "kpi-val", style: {color:'var(--green)'} }, "AED " + stats.net.toLocaleString())),
                e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Receivables"), e("div", { className: "kpi-val" }, "AED " + stats.ar.toLocaleString())),
                e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Cash Balance"), e("div", { className: "kpi-val", style: {color:'var(--blue)'} }, "AED " + stats.bank.toLocaleString()))
            ),
            e("div", { className: "card" },
                e("h3", { style: {marginBottom: '15px'} }, "Quick Post"),
                e("div", { style: { display: 'flex', gap: '10px' } },
                    e("input", { type: 'date', id: 'q_d', defaultValue: new Date().toISOString().split('T')[0], style: { width: '150px' } }),
                    e("input", { type: 'text', id: 'q_t', placeholder: 'Expense or Income description...' }),
                    e("input", { type: 'number', id: 'q_a', placeholder: 'Amount' }),
                    e("button", { className: 'btn-primary', onClick: () => {
                        const d = document.getElementById('q_d').value;
                        const t = document.getElementById('q_t').value;
                        const a = parseFloat(document.getElementById('q_a').value);
                        if (!t || isNaN(a)) return;
                        setTxns([{ id: Date.now(), date: d, description: t, amount: a, contraAccount: 'Suspense' }, ...txns]);
                        document.getElementById('q_t').value = ''; document.getElementById('q_a').value = '';
                    } }, "Post Entry")
                )
            )
        );

        const Invoices = () => e("div", null,
            e("div", { style: {display:'flex', justifyContent:'space-between', marginBottom:'20px'} },
                e("h2", null, "Tax Invoices"),
                e("button", { className:'btn-primary', onClick: () => {
                    const name = prompt("Client Name?");
                    const amt = prompt("Amount?");
                    if(name && amt) setInvoices([{id: Date.now(), invNo: 'INV-'+(invoices.length+1), client: name, amount: parseFloat(amt), paid: 0, date: new Date().toISOString().split('T')[0]}, ...invoices]);
                }}, "+ New Invoice")
            ),
            e("div", { className: "card" },
                e("table", null,
                    e("thead", null, e("tr", null, e("th", null, "Date"), e("th", null, "Inv #"), e("th", null, "Client"), e("th", { style: { textAlign: 'right' } }, "Total"))),
                    e("tbody", null, invoices.map(i => e("tr", { key: i.id },
                        e("td", null, i.date), e("td", { style: {fontWeight:700} }, i.invNo), e("td", null, i.client), e("td", { style: { textAlign: 'right', fontWeight:700 } }, "AED " + i.amount.toLocaleString())
                    )), invoices.length === 0 && e("tr", null, e("td", { colSpan: 4, style: { textAlign: 'center', padding: '40px', color:'var(--text-muted)' } }, "No invoices recorded yet.")))
                )
            )
        );

        const COA = () => e("div", { className: "card" },
            e("h2", null, "Chart of Accounts"),
            e("table", null,
                e("thead", null, e("tr", null, e("th", null, "Account"), e("th", null, "Type"))),
                e("tbody", null, coa.map(a => e("tr", { key: a.name },
                    e("td", { style: {fontWeight:600} }, a.name), e("td", null, a.type)
                )))
            )
        );

        // --- COMPANY SELECTOR SCREEN ---
        if (!activeCompany) {
            return e("div", { style: { display: 'flex', width: '100vw', height: '100vh', alignItems: 'center', justifyContent: 'center' } },
                e("div", { className: 'card', style: { width: '400px', padding: '40px', textAlign: 'center' } },
                    e("h1", { style: { marginBottom: '5px' } }, "CherrySoft Pro"),
                    e("p", { style: { color: 'var(--text-muted)', marginBottom: '30px' } }, "Multi-Company Safe Gateway"),
                    
                    companies.length > 0 && e("div", { style: { textAlign: 'left', marginBottom: '30px' } },
                        e("label", { style: { fontSize: '10px', fontWeight: 800 } }, "OPEN EXISTING BOOKS"),
                        companies.map(c => e("button", { key: c.slug, style: { display: 'block', width: '100%', textAlign: 'left', background: 'var(--surface-alt)', border: '1px solid var(--border)', padding: '12px', marginTop: '8px', color: 'white' }, onClick: () => loadCompany(c) }, "🏢 " + c.name))
                    ),

                    e("div", { style: { borderTop: '1px solid var(--border)', paddingTop: '20px' } },
                        e("label", { style: { fontSize: '10px', fontWeight: 800 } }, "START NEW COMPANY"),
                        e("input", { id: 'nc', placeholder: 'Company Name (e.g. My Shop LLC)', style: { marginTop: '10px' } }),
                        e("button", { className: 'btn-primary', style: { width: '100%', marginTop: '15px', justifyContent: 'center' }, onClick: () => createCompany(document.getElementById('nc').value) }, "Create New Books")
                    )
                )
            );
        }

        // --- MAIN APP LAYOUT ---
        return e(React.Fragment, null,
            e("div", { className: "sidebar" },
                e("div", { className: "nav-header" }, 
                    e("div", { style: { fontWeight: 900, color: 'var(--accent)', fontSize: '16px' } }, "CHERRYSOFT"),
                    e("div", { style: { fontSize: '10px', color: 'var(--green)', marginTop: '4px' } }, "● " + activeCompany.name)
                ),
                e("div", { className: "nav-section" }, "Main"),
                e("div", { className: `nav-item ${page === 'dashboard' ? 'active' : ''}`, onClick: () => setPage('dashboard') }, "📊 Dashboard"),
                e("div", { className: `nav-item ${page === 'banking' ? 'active' : ''}`, onClick: () => setPage('banking') }, "🏦 Banking"),
                e("div", { className: "nav-section" }, "Sales"),
                e("div", { className: `nav-item ${page === 'invoices' ? 'active' : ''}`, onClick: () => setPage('invoices') }, "🧾 Invoices"),
                e("div", { className: "nav-section" }, "Admin"),
                e("div", { className: `nav-item ${page === 'coa' ? 'active' : ''}`, onClick: () => setPage('coa') }, "📑 Accounts"),
                e("div", { style: { marginTop: 'auto', padding: '20px' } },
                    e("button", { className: 'btn-outline', style: { width: '100%', color: 'var(--red)' }, onClick: () => setActiveCompany(null) }, "🚪 Exit Company")
                )
            ),
            e("div", { className: "main-content" },
                e("div", { style: { display: 'flex', justifyContent: 'space-between', borderBottom: '1px solid var(--border)', paddingBottom: '15px', marginBottom: '25px' } },
                    e("h2", { style: { textTransform: 'uppercase', letterSpacing: '1px' } }, page),
                    e("div", { style: { textAlign: 'right' } }, 
                        e("div", { style: { fontSize: '10px', color: 'var(--text-muted)' } }, "Isolated Session"),
                        e("div", { style: { fontWeight: 700 } }, activeCompany.name))
                ),
                page === "dashboard" && e(Dashboard),
                page === "invoices" && e(Invoices),
                page === "coa" && e(COA),
                !["dashboard", "invoices", "coa"].includes(page) && e("div", { className: 'card', style: { padding: '50px', textAlign: 'center' } }, e("h2", null, "Coming Soon"), e("p", { style: { color: 'var(--text-muted)' } }, "This module is being initialized for your data."))
            )
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>

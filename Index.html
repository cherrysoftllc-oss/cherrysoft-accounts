<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherrySoft Accounts Pro</title>
  
  <!-- STABLE LIBRARIES (Audited for 404s) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface-alt: #21253a;
      --border: #2a2f47; --accent: #6c63ff; --text: #e8eaf6;
      --text-muted: #7b82a8; --green: #2dd4a0; --red: #f26565; --amber: #f5a623;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    #root { height: 100vh; width: 100vw; display: flex; }
    
    .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    .main-content { flex: 1; overflow-y: auto; padding: 30px; height: 100vh; }
    
    .nav-header { padding: 25px 20px; border-bottom: 1px solid var(--border); }
    .nav-section { padding: 15px 20px 5px; font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .nav-item { padding: 12px 20px; cursor: pointer; color: var(--text-muted); transition: 0.2s; font-size: 13px; }
    .nav-item:hover { background: var(--surface-alt); color: var(--text); }
    .nav-item.active { background: var(--accent); color: white; font-weight: 600; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: var(--surface-alt); border: 1px solid var(--border); padding: 15px; border-radius: 10px; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 10px; color: var(--text-muted); font-size: 11px; border-bottom: 1px solid var(--border); }
    td { padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
    
    button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    
    input, select { background: var(--surface-alt); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; }
    
    .loading-screen { width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading-screen">
      <h1>CherrySoft Pro</h1>
      <p style="color: #7b82a8; margin-top: 10px;">Initializing Core Engine...</p>
      <noscript><p style="color: red;">Please enable JavaScript to run this app.</p></noscript>
    </div>
  </div>

  <script>
    // --- AUDIT: RESOURCE CHECK ---
    if (!window.React || !window.ReactDOM) {
        document.getElementById('root').innerHTML = `
            <div style="padding:40px; color:white; text-align:center;">
                <h2 style="color:#f26565;">Connection Error (404)</h2>
                <p>Could not load accounting libraries. Please check your internet and reload.</p>
                <button onclick="location.reload()" style="margin-top:20px; background:#6c63ff; color:white; border:none; padding:10px 20px; border-radius:5px;">Retry Connection</button>
            </div>
        `;
    }

    const { useState, useEffect, useMemo, useCallback } = React;
    const e = React.createElement;

    // --- DEFAULTS ---
    const DEFAULT_COA = [
        {name:"Sales Income", type:"Income"}, {name:"Cost of Goods Sold", type:"Expense"},
        {name:"Main Bank", type:"Asset", sub:"Cash & Bank"}, {name:"Accounts Receivable", type:"Asset"},
        {name:"Accounts Payable", type:"Liability"}, {name:"Suspense", type:"Asset"}
    ];

    function App() {
        const [activeCompany, setActiveCompany] = useState(null);
        const [companies, setCompanies] = useState([]);
        const [page, setPage] = useState("dashboard");
        
        // --- DATA STATE ---
        const [txns, setTxns] = useState([]);
        const [invoices, setInvoices] = useState([]);
        const [bills, setBills] = useState([]);

        // --- LOAD INDEX ---
        useEffect(() => {
            const idx = localStorage.getItem("cs_pro_index_v4");
            if (idx) setCompanies(JSON.parse(idx));
        }, []);

        // --- MULTI-COMPANY PERSISTENCE ---
        const saveAll = useCallback(() => {
            if (!activeCompany) return;
            const data = { txns, invoices, bills };
            localStorage.setItem(`cs_pro_data_${activeCompany.slug}`, JSON.stringify(data));
            localStorage.setItem("cs_pro_index_v4", JSON.stringify(companies));
        }, [txns, invoices, bills, activeCompany, companies]);

        useEffect(() => {
            const timer = setTimeout(saveAll, 800);
            return () => clearTimeout(timer);
        }, [saveAll]);

        const loadCompany = (co) => {
            const raw = localStorage.getItem(`cs_pro_data_${co.slug}`);
            if (raw) {
                const d = JSON.parse(raw);
                setTxns(d.txns || []);
                setInvoices(d.invoices || []);
                setBills(d.bills || []);
            } else {
                setTxns([]); setInvoices([]); setBills([]);
            }
            setActiveCompany(co);
            setPage("dashboard");
        };

        const createCompany = (name) => {
            if (!name.trim()) return;
            const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const newCo = { name, slug, id: Date.now() };
            const newList = [...companies, newCo];
            setCompanies(newList);
            localStorage.setItem("cs_pro_index_v4", JSON.stringify(newList));
            loadCompany(newCo);
        };

        // --- CALCULATIONS ---
        const totals = useMemo(() => {
            const bank = txns.reduce((s, t) => s + t.amount, 0);
            const ar = invoices.reduce((s, i) => s + (i.total - (i.paid || 0)), 0);
            const ap = bills.reduce((s, b) => s + (b.total - (b.paid || 0)), 0);
            const profit = invoices.reduce((s, i) => s + i.total, 0) - txns.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
            return { bank, ar, ap, profit };
        }, [txns, invoices, bills]);

        // --- PAGE COMPONENTS ---
        
        const Sidebar = () => e("div", { className: "sidebar" },
            e("div", { className: "nav-header" }, 
                e("div", { style: { fontWeight: 900, color: 'var(--accent)', fontSize: '15px' } }, "CHERRYSOFT PRO"),
                e("div", { style: { fontSize: '10px', color: 'var(--green)', marginTop: '4px' } }, "🏢 " + activeCompany.name)
            ),
            e("div", { className: "nav-section" }, "Main"),
            e("div", { className: `nav-item ${page === 'dashboard' ? 'active' : ''}`, onClick: () => setPage('dashboard') }, "🏠 Dashboard"),
            e("div", { className: `nav-item ${page === 'banking' ? 'active' : ''}`, onClick: () => setPage('banking') }, "🏦 Banking"),
            e("div", { className: "nav-section" }, "Accounting"),
            e("div", { className: `nav-item ${page === 'invoices' ? 'active' : ''}`, onClick: () => setPage('invoices') }, "🧾 Sales (Invoices)"),
            e("div", { className: `nav-item ${page === 'purchases' ? 'active' : ''}`, onClick: () => setPage('purchases') }, "🛒 Purchases (Bills)"),
            e("div", { className: `nav-item ${page === 'coa' ? 'active' : ''}`, onClick: () => setPage('coa') }, "📑 Chart of Accounts"),
            e("div", { style: { marginTop: 'auto', padding: '20px' } },
                e("button", { className: "btn-outline", style: { width: '100%', color: 'var(--red)' }, onClick: () => setActiveCompany(null) }, "🚪 Switch Company")
            )
        );

        const DashboardView = () => e("div", null,
            e("div", { className: "kpi-grid" },
                e("div", { className: "kpi-card" }, e("div", { style: { fontSize: '10px', color: 'var(--text-muted)' } }, "NET PROFIT"), e("div", { className: "kpi-value", style: { color: 'var(--green)' } }, "AED " + totals.profit.toLocaleString())),
                e("div", { className: "kpi-card" }, e("div", { style: { fontSize: '10px', color: 'var(--text-muted)' } }, "RECEIVABLES (AR)"), e("div", { className: "kpi-value" }, "AED " + totals.ar.toLocaleString())),
                e("div", { className: "kpi-card" }, e("div", { style: { fontSize: '10px', color: 'var(--text-muted)' } }, "PAYABLES (AP)"), e("div", { className: "kpi-value", style: { color: 'var(--amber)' } }, "AED " + totals.ap.toLocaleString())),
                e("div", { className: "kpi-card" }, e("div", { style: { fontSize: '10px', color: 'var(--text-muted)' } }, "CASH ON HAND"), e("div", { className: "kpi-value", style: { color: 'var(--blue)' } }, "AED " + totals.bank.toLocaleString()))
            ),
            e("div", { className: "card" },
                e("h3", null, "Quick Post"),
                e("div", { style: { display: 'flex', gap: '10px', marginTop: '15px' } },
                    e("input", { id: "qd", type: "date", defaultValue: new Date().toISOString().split('T')[0], style: { width: '150px' } }),
                    e("input", { id: "qn", placeholder: "Description (e.g. DEWA Payment)", style: { flex: 1 } }),
                    e("input", { id: "qa", type: "number", placeholder: "Amount", style: { width: '120px' } }),
                    e("button", { className: "btn-primary", onClick: () => {
                        const d = document.getElementById('qd').value;
                        const n = document.getElementById('qn').value;
                        const a = parseFloat(document.getElementById('qa').value);
                        if (!n || isNaN(a)) return;
                        setTxns([{ id: Date.now(), date: d, description: n, amount: a, contraAccount: 'Suspense' }, ...txns]);
                        document.getElementById('qn').value = ''; document.getElementById('qa').value = '';
                    } }, "Post Entry")
                )
            ),
            e("div", { className: "card" },
                e("h3", null, "Recent Activity"),
                e("table", { className: "table" },
                    e("thead", null, e("tr", null, e("th", null, "Date"), e("th", null, "Description"), e("th", { style: { textAlign: 'right' } }, "Amount"))),
                    e("tbody", null, txns.slice(0, 5).map(t => e("tr", { key: t.id },
                        e("td", null, t.date), e("td", null, t.description), e("td", { style: { textAlign: 'right', fontWeight: 'bold', color: t.amount < 0 ? 'var(--red)' : 'var(--green)' } }, t.amount.toLocaleString())
                    )), txns.length === 0 && e("tr", null, e("td", { colSpan: 3, style: { textAlign: 'center', color: 'var(--text-dim)', padding: '20px' } }, "No transactions yet.")))
                )
            )
        );

        const PageHeader = (title) => e("div", { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '25px', borderBottom: '1px solid var(--border)', paddingBottom: '10px' } },
            e("h2", { style: { textTransform: 'uppercase', letterSpacing: '1px' } }, title),
            e("div", { style: { textAlign: 'right', fontSize: '11px' } }, e("div", { style: { color: 'var(--text-muted)' } }, "Real-time Autosave"), e("div", { style: { fontWeight: 700 } }, activeCompany.name))
        );

        const InvoicesView = () => e("div", null,
            PageHeader("Sales & Invoices"),
            e("div", { style: { marginBottom: '15px' } },
                e("button", { className: "btn-primary", onClick: () => setInvoices([{ id: Date.now(), invNo: 'INV-' + (invoices.length + 1), client: 'New Customer', total: 0, paid: 0, date: new Date().toISOString().split('T')[0] }, ...invoices]) }, "+ Create New Invoice")
            ),
            e("div", { className: "card" },
                e("table", { className: "table" },
                    e("thead", null, e("tr", null, e("th", null, "Inv #"), e("th", null, "Customer"), e("th", null, "Date"), e("th", { style: { textAlign: 'right' } }, "Amount"))),
                    e("tbody", null, invoices.map(i => e("tr", { key: i.id },
                        e("td", { style: { fontWeight: 700, color: 'var(--accent)' } }, i.invNo), e("td", null, i.client), e("td", null, i.date), e("td", { style: { textAlign: 'right' } }, "AED " + i.total.toLocaleString())
                    )), invoices.length === 0 && e("tr", null, e("td", { colSpan: 4, style: { textAlign: 'center', padding: '30px' } }, "No invoices found.")))
                )
            )
        );

        // --- RENDER SELECTOR OR APP ---
        if (!activeCompany) {
            return e("div", { style: { width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
                e("div", { className: "card", style: { width: '400px', padding: '40px' } },
                    e("h1", { style: { textAlign: 'center', marginBottom: '10px' } }, "CherrySoft Pro"),
                    e("p", { style: { textAlign: 'center', color: 'var(--text-muted)', marginBottom: '30px' } }, "Isolated Multi-Company Accounting"),
                    
                    companies.length > 0 && e("div", { style: { marginBottom: '25px' } },
                        e("label", { style: { fontSize: '10px', fontWeight: 800, color: 'var(--text-dim)' } }, "OPEN EXISTING BOOKS"),
                        companies.map(c => e("button", { key: c.slug, style: { display: 'block', width: '100%', textAlign: 'left', background: 'var(--surface-alt)', border: '1px solid var(--border)', padding: '12px', marginTop: '8px', color: 'white' }, onClick: () => loadCompany(c) }, "🏢 " + c.name))
                    ),

                    e("div", { style: { borderTop: '1px solid var(--border)', paddingTop: '20px' } },
                        e("label", { style: { fontSize: '10px', fontWeight: 800, color: 'var(--text-dim)' } }, "START NEW BOOKS"),
                        e("input", { id: "new_co_name", placeholder: "Company Name (e.g. Sharif Decor)" }),
                        e("button", { className: "btn-primary", style: { width: '100%', marginTop: '15px' }, onClick: () => createCompany(document.getElementById('new_co_name').value) }, "Initialize Company")
                    )
                )
            );
        }

        return e(React.Fragment, null,
            e(Sidebar),
            e("div", { className: "main-content" },
                page === "dashboard" && e(DashboardView),
                page === "invoices" && e(InvoicesView),
                ["banking", "purchases", "coa"].includes(page) && e("div", null, 
                    PageHeader(page),
                    e("div", { className: "card", style: { textAlign: 'center', padding: '50px' } }, 
                        e("h2", null, "Ready for Data"), 
                        e("p", { style: { color: 'var(--text-muted)', margin: '10px 0' } }, "This module is active and waiting for your " + activeCompany.name + " records."),
                        e("button", { className: "btn-primary", style: { marginTop: '20px' }, onClick: () => setPage("dashboard") }, "Back to Dashboard")
                    )
                )
            )
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>

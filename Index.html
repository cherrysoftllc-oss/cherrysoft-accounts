<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherrySoft Accounts Pro</title>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface-alt: #21253a;
      --border: #2a2f47; --accent: #6c63ff; --accent-soft: rgba(108, 99, 255, 0.1);
      --text: #e8eaf6; --text-muted: #7b82a8; --text-dim: #4a5080;
      --green: #2dd4a0; --red: #f26565; --amber: #f5a623; --blue: #38bdf8;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.5;}
    #root{min-height:100vh;display:flex;}
    .sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);height:100vh;position:sticky;top:0;padding:20px 0;flex-shrink:0;overflow-y:auto;}
    .main{flex:1;padding:25px;overflow-x:hidden;}
    .nav-sec{padding:10px 20px 5px;font-size:10px;font-weight:700;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.1em;}
    .nav-item{padding:8px 20px;cursor:pointer;color:var(--text-muted);border-left:3px solid transparent;transition:0.2s;}
    .nav-item:hover{background:var(--surface-alt);color:var(--text);}
    .nav-item.active{background:var(--accent-soft);color:var(--text);border-left-color:var(--accent);font-weight:600;}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:15px;}
    .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));gap:12px;margin-bottom:20px;}
    .kpi-card{background:var(--surface-alt);padding:15px;border-radius:8px;border:1px solid var(--border);}
    .kpi-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;margin-bottom:5px;}
    .kpi-value{font-size:18px;font-weight:700;}
    table{width:100%;border-collapse:collapse;}
    th{text-align:left;padding:10px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border);text-transform:uppercase;}
    td{padding:10px;border-bottom:1px solid var(--border);font-size:12px;}
    button{padding:8px 16px;border-radius:6px;border:none;font-weight:600;cursor:pointer;font-size:12px;}
    .btn-primary{background:var(--accent);color:white;}
    .btn-ghost{background:var(--surface-alt);color:var(--text);}
    input, select, textarea{background:var(--surface-alt);border:1px solid var(--border);color:white;padding:8px;border-radius:6px;outline:none;}
    .badge{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;text-transform:uppercase;}
    .badge-paid{background:rgba(45,212,160,0.1);color:var(--green);}
    .badge-unpaid{background:rgba(242,101,101,0.1);color:var(--red);}
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
const { useState, useEffect, useMemo, useCallback, useRef, Fragment } = React;

// --- CONFIG & CONSTANTS ---
const APP_VERSION = "3.5-CLEAN-PRO";
const GOOGLE_CLIENT_ID = "916785261941-vc25phs8dn3vlmcn7lqggnuppsg3ug0p.apps.googleusercontent.com";
const COMPANIES_INDEX_FILE = "CherrySoft_Index_v3.json";

const DEFAULT_COA = [
  {code:"4101",name:"Sales Income",type:"Income",sub:"Revenue"},
  {code:"4501",name:"Cost of Goods Sold",type:"Expense",sub:"COGS"},
  {code:"5101",name:"Staff Salaries",type:"Expense",sub:"Staff"},
  {code:"6101",name:"Office Rent",type:"Expense",sub:"Premises"},
  {code:"B001",name:"Bank_Main",type:"Asset",sub:"Cash & Bank"},
  {code:"B002",name:"Petty Cash",type:"Asset",sub:"Cash & Bank"},
  {code:"A001",name:"Accounts Receivable",type:"Asset",sub:"Receivables"},
  {code:"L001",name:"Accounts Payable",type:"Liability",sub:"Payables"},
  {code:"L003",name:"VAT Payable",type:"Liability",sub:"Tax"},
  {code:"E001",name:"Owner Equity",type:"Equity",sub:"Equity"},
  {code:"S001",name:"Suspense",type:"Asset",sub:"Suspense"}
];

// --- UTILS ---
const fmtAED = (n) => (n || 0).toLocaleString('en-AE', { style: 'currency', currency: 'AED' });
const fmtDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric'}) : '—';
const getSlug = (name) => name.toLowerCase().replace(/[^a-z0-9]/g, '_').slice(0, 30);

// --- APP ENGINE ---
function App() {
  const [activeCompany, setActiveCompany] = useState(null);
  const [companies, setCompanies] = useState([]);
  const [driveToken, setDriveToken] = useState(null);
  const [page, setPage] = useState("dashboard");
  const [loading, setLoading] = useState(false);

  // Business State
  const [txns, setTxns] = useState([]);
  const [invoices, setInvoices] = useState([]);
  const [vendorBills, setVendorBills] = useState([]);
  const [coa, setCoa] = useState(DEFAULT_COA);
  const [customers, setCustomers] = useState([]);
  const [vendors, setVendors] = useState([]);
  const [rules, setRules] = useState([]);

  // --- PERSISTENCE LOGIC ---
  
  const saveToLocal = (slug, data) => {
    localStorage.setItem(`cs_v3_data_${slug}`, JSON.stringify(data));
  };

  const loadFromLocal = (slug) => {
    const raw = localStorage.getItem(`cs_v3_data_${slug}`);
    return raw ? JSON.parse(raw) : null;
  };

  const syncToDrive = async (data) => {
    if (!driveToken || !activeCompany) return;
    // Logic to upload activeCompany.slug + data to Drive...
    console.log("Autosaving to Drive...");
  };

  // Real-time Autosave Effect
  useEffect(() => {
    if (activeCompany) {
      const data = { txns, invoices, vendorBills, coa, customers, vendors, rules };
      saveToLocal(activeCompany.slug, data);
      const timer = setTimeout(() => syncToDrive(data), 2000);
      return () => clearTimeout(timer);
    }
  }, [txns, invoices, vendorBills, coa, customers, vendors, rules, activeCompany]);

  // --- ACCOUNTING LOGIC ---
  const pl = useMemo(() => {
    const income = invoices.reduce((s, i) => s + (i.total || 0), 0);
    const expenses = txns.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
    return { income, expenses, net: income - expenses };
  }, [txns, invoices]);

  const arBalance = useMemo(() => invoices.reduce((s, i) => s + ((i.total || 0) - (i.paidAmount || 0)), 0), [invoices]);
  const apBalance = useMemo(() => vendorBills.reduce((s, b) => s + ((b.total || 0) - (b.paidAmount || 0)), 0), [vendorBills]);

  // --- ACTIONS ---
  const createCompany = (name) => {
    if (!name) return;
    const slug = getSlug(name);
    const newCo = { name, slug, id: Date.now() };
    const updatedCos = [...companies, newCo];
    setCompanies(updatedCos);
    localStorage.setItem("cs_v3_index", JSON.stringify(updatedCos));
    
    // Initialize blank company
    setTxns([]); setInvoices([]); setVendorBills([]); 
    setCoa(DEFAULT_COA); setCustomers([]); setVendors([]); setRules([]);
    setActiveCompany(newCo);
    setPage("dashboard");
  };

  const selectCompany = (co) => {
    const cached = loadFromLocal(co.slug);
    if (cached) {
      setTxns(cached.txns || []);
      setInvoices(cached.invoices || []);
      setVendorBills(cached.vendorBills || []);
      setCoa(cached.coa || DEFAULT_COA);
      setCustomers(cached.customers || []);
      setVendors(cached.vendors || []);
      setRules(cached.rules || []);
    }
    setActiveCompany(co);
    setPage("dashboard");
  };

  const driveSignIn = () => {
    const client = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: "https://www.googleapis.com/auth/drive.file",
      callback: (resp) => { 
        if (resp.access_token) {
          setDriveToken(resp.access_token);
          const idx = localStorage.getItem("cs_v3_index");
          if (idx) setCompanies(JSON.parse(idx));
        }
      }
    });
    client.requestAccessToken();
  };

  // --- PAGE RENDERING ---

  const renderDashboard = () => (
    <div className="fade-in">
      <div className="kpi-grid">
        <div className="kpi-card">
          <div className="kpi-label">Net Profit</div>
          <div className="kpi-value" style={{color: pl.net >= 0 ? 'var(--green)' : 'var(--red)'}}>{fmtAED(pl.net)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Accounts Receivable</div>
          <div className="kpi-value">{fmtAED(arBalance)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Accounts Payable</div>
          <div className="kpi-value" style={{color: 'var(--amber)'}}>{fmtAED(apBalance)}</div>
        </div>
        <div className="kpi-card">
          <div className="kpi-label">Bank Balance</div>
          <div className="kpi-value" style={{color: 'var(--blue)'}}>{fmtAED(txns.reduce((s,t)=>s+t.amount, 0))}</div>
        </div>
      </div>

      <div className="card">
        <div style={{display:'flex', justifyContent:'space-between', marginBottom:'15px'}}>
          <h3>Quick Transaction</h3>
          <span style={{fontSize:'10px', color:'var(--text-dim)'}}>Saves Automatically</span>
        </div>
        <div style={{display:'flex', gap:'10px'}}>
          <input type="date" id="qd" style={{width:'150px'}} defaultValue={new Date().toISOString().split('T')[0]} />
          <input type="text" id="qt" placeholder="Description (e.g. Office Supplies)" style={{flex:1}} />
          <input type="number" id="qa" placeholder="Amount" style={{width:'120px'}} />
          <button className="btn-primary" onClick={()=>{
            const d = document.getElementById('qd').value;
            const t = document.getElementById('qt').value;
            const a = parseFloat(document.getElementById('qa').value);
            if(!t || !a) return;
            setTxns([{ id: Date.now(), date: d, description: t, amount: a, contraAccount: 'Suspense', sourceAccount: 'Bank_Main' }, ...txns]);
            document.getElementById('qt').value = ''; document.getElementById('qa').value = '';
          }}>Post</button>
        </div>
      </div>

      <div className="card">
        <h3>Recent Transactions</h3>
        <table className="table">
          <thead>
            <tr><th>Date</th><th>Description</th><th>Account</th><th style={{textAlign:'right'}}>Amount</th></tr>
          </thead>
          <tbody>
            {txns.slice(0, 10).map(t => (
              <tr key={t.id}>
                <td>{fmtDate(t.date)}</td>
                <td>{t.description}</td>
                <td style={{color:'var(--accent)'}}>{t.contraAccount}</td>
                <td style={{textAlign:'right', fontWeight:700, color: t.amount < 0 ? 'var(--red)' : 'var(--green)'}}>
                  {fmtAED(t.amount)}
                </td>
              </tr>
            ))}
            {txns.length === 0 && <tr><td colSpan="4" style={{textAlign:'center', padding:'40px', color:'var(--text-dim)'}}>No transactions found.</td></tr>}
          </tbody>
        </table>
      </div>
    </div>
  );

  const renderInvoices = () => (
    <div className="fade-in">
      <div style={{display:'flex', justifyContent:'space-between', marginBottom:'20px'}}>
        <h2>Invoice Manager</h2>
        <button className="btn-primary" onClick={() => setInvoices([{ id: Date.now(), invNo: 'INV-'+(invoices.length+1), date: new Date(), client: 'New Client', total: 0, paidAmount: 0, status: 'unpaid' }, ...invoices])}>+ Create Invoice</button>
      </div>
      <div className="card">
        <table className="table">
          <thead>
            <tr><th>Inv #</th><th>Date</th><th>Client</th><th>Total</th><th>Status</th><th>Action</th></tr>
          </thead>
          <tbody>
            {invoices.map(inv => (
              <tr key={inv.id}>
                <td style={{fontWeight:700}}>{inv.invNo}</td>
                <td>{fmtDate(inv.date)}</td>
                <td>{inv.client}</td>
                <td>{fmtAED(inv.total)}</td>
                <td><span className={`badge badge-${inv.status}`}>{inv.status}</span></td>
                <td><button className="btn-ghost" style={{padding:'4px 8px', fontSize:'10px'}}>View</button></td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );

  const renderBanking = () => (
    <div className="card">
      <h2>Banking & Ledger</h2>
      <p style={{color:'var(--text-muted)', margin:'10px 0'}}>Manage your bank accounts and reconcile statement imports.</p>
      <div style={{display:'flex', gap:'10px', marginTop: '20px'}}>
        <button className="btn-primary">Import Bank CSV</button>
        <button className="btn-ghost">Add Bank Account</button>
      </div>
    </div>
  );

  const renderCOA = () => (
    <div className="card">
      <h2>Chart of Accounts</h2>
      <table className="table">
        <thead><tr><th>Code</th><th>Name</th><th>Type</th><th>Balance</th></tr></thead>
        <tbody>
          {coa.map(a => (
            <tr key={a.name}>
              <td>{a.code || '—'}</td>
              <td style={{fontWeight:600}}>{a.name}</td>
              <td><span className="badge" style={{background:'var(--surface-alt)'}}>{a.type}</span></td>
              <td>{fmtAED(0)}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );

  // --- SELECTOR SCREEN ---
  if (!activeCompany) {
    return (
      <div style={{width:'100vw', height:'100vh', display:'flex', alignItems:'center', justifyContent:'center'}}>
        {!driveToken ? (
           <div className="card" style={{width:'380px', textAlign:'center', padding:'40px'}}>
            <h1 style={{fontSize:'24px', marginBottom:'10px'}}>CherrySoft Accounts</h1>
            <p style={{color:'var(--text-muted)', marginBottom:'30px'}}>Please sign in to your Google Drive to manage your companies.</p>
            <button className="btn-primary" style={{width:'100%', padding:'12px'}} onClick={driveSignIn}>Sign in with Google</button>
           </div>
        ) : (
          <div style={{width:'500px'}}>
            <h2 style={{marginBottom:'20px'}}>Select Company</h2>
            {companies.map(co => (
              <div key={co.slug} className="card" style={{display:'flex', justifyContent:'space-between', alignItems:'center'}}>
                <div>
                  <div style={{fontWeight:700, fontSize:'16px'}}>🏢 {co.name}</div>
                  <div style={{fontSize:'10px', color:'var(--text-muted)'}}>{co.slug}</div>
                </div>
                <button className="btn-primary" onClick={() => selectCompany(co)}>Open Books</button>
              </div>
            ))}
            <div className="card" style={{marginTop:'30px', borderStyle:'dashed'}}>
              <h3 style={{marginBottom:'10px'}}>Create New Company</h3>
              <input type="text" id="newCoName" placeholder="Company Name (e.g. Sharif Interiors)" style={{marginBottom:'10px'}} />
              <button className="btn-primary" style={{width:'100%', background:'var(--green)'}} onClick={() => createCompany(document.getElementById('newCoName').value)}>Start New Books</button>
            </div>
          </div>
        )}
      </div>
    );
  }

  // --- MAIN APP RENDER ---
  return (
    <Fragment>
      <div className="sidebar">
        <div style={{padding:'0 20px 20px', borderBottom:'1px solid var(--border)', marginBottom: '10px'}}>
          <div style={{fontWeight:800, fontSize:'14px'}}>CHERRYSOFT PRO</div>
          <div style={{fontSize:'10px', color:'var(--green)'}}>● {activeCompany.name}</div>
        </div>
        
        <div className="nav-sec">Main</div>
        <div className={`nav-item ${page==='dashboard'?'active':''}`} onClick={()=>setPage('dashboard')}>🏠 Dashboard</div>
        <div className={`nav-item ${page==='banking'?'active':''}`} onClick={()=>setPage('banking')}>🏦 Banking</div>
        
        <div className="nav-sec">Sales</div>
        <div className={`nav-item ${page==='invoices'?'active':''}`} onClick={()=>setPage('invoices')}>🧾 Invoices</div>
        <div className={`nav-item ${page==='clients'?'active':''}`} onClick={()=>setPage('clients')}>👥 Clients</div>
        
        <div className="nav-sec">Expenses</div>
        <div className={`nav-item ${page==='purchases'?'active':''}`} onClick={()=>setPage('purchases')}>🛒 Purchase List</div>
        <div className={`nav-item ${page==='petty'?'active':''}`} onClick={()=>setPage('petty')}>💵 Petty Cash</div>
        
        <div className="nav-sec">Accounting</div>
        <div className={`nav-item ${page==='coa'?'active':''}`} onClick={()=>setPage('coa')}>📑 Chart of Accounts</div>
        <div className={`nav-item ${page==='jv'?'active':''}`} onClick={()=>setPage('jv')}>📝 Journal Entries</div>
        
        <div style={{padding:'20px'}}>
          <button className="btn-ghost" style={{width:'100%', fontSize:'10px', color:'var(--red)'}} onClick={() => setActiveCompany(null)}>🚪 Switch Company</button>
        </div>
      </div>

      <div className="main">
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'25px'}}>
          <h1 style={{textTransform:'uppercase', letterSpacing:'1px'}}>{page}</h1>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:'10px', color:'var(--text-muted)'}}>Last Saved: {new Date().toLocaleTimeString()}</div>
            <div style={{fontSize:'12px', fontWeight:700}}>{activeCompany.name}</div>
          </div>
        </div>

        {page === "dashboard" && renderDashboard()}
        {page === "invoices" && renderInvoices()}
        {page === "banking" && renderBanking()}
        {page === "coa" && renderCOA()}
        
        {/* Placeholder for other functional pages */}
        {["clients", "purchases", "petty", "jv"].includes(page) && (
          <div className="card" style={{padding:'50px', textAlign:'center'}}>
            <h2>{page.toUpperCase()} PAGE</h2>
            <p style={{color:'var(--text-muted)'}}>This module is ready for your data.</p>
            <button className="btn-primary" style={{marginTop:'20px'}} onClick={()=>setPage('dashboard')}>Return to Dashboard</button>
          </div>
        )}
      </div>
    </Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
  </script>
</body>
</html>

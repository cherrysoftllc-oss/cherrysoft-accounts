<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CherrySoft Pro Accounts</title>
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface-alt: #21253a;
      --border: #2a2f47; --accent: #6c63ff; --accent-soft: rgba(108, 99, 255, 0.1);
      --text: #e8eaf6; --text-muted: #7b82a8; --text-dim: #4a5080;
      --green: #2dd4a0; --red: #f26565; --amber: #f5a623; --blue: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.4; overflow: hidden; }
    #root { height: 100vh; width: 100vw; display: flex; }
    
    /* Responsive Modes */
    .app-container { display: flex; width: 100%; height: 100vh; }
    .iphone-mode { width: 390px; height: 844px; margin: auto; border: 10px solid #333; border-radius: 40px; position: relative; overflow: hidden; box-shadow: 0 20px 50px #000; background: var(--bg); }
    .iphone-mode .sidebar { width: 100%; height: 60px; position: absolute; bottom: 0; flex-direction: row; border: none; border-top: 1px solid var(--border); padding: 0; }
    .iphone-mode .main { height: calc(100% - 60px); padding: 15px; padding-bottom: 80px; }

    /* Sidebar */
    .sidebar { width: 230px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .nav-head { padding: 20px; border-bottom: 1px solid var(--border); }
    .nav-item { padding: 10px 20px; cursor: pointer; color: var(--text-muted); font-size: 12px; border-left: 3px solid transparent; transition: 0.2s; }
    .nav-item:hover { background: var(--surface-alt); color: white; }
    .nav-item.active { background: var(--accent-soft); color: white; border-left-color: var(--accent); font-weight: 600; }
    .nav-sec { padding: 15px 20px 5px; font-size: 10px; font-weight: 800; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

    /* Content */
    .main { flex: 1; overflow-y: auto; padding: 25px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: var(--surface-alt); border: 1px solid var(--border); padding: 15px; border-radius: 10px; }
    .kpi-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }
    .kpi-val { font-size: 18px; font-weight: 700; margin-top: 5px; }

    /* Elements */
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px; color: var(--text-muted); border-bottom: 1px solid var(--border); font-size: 10px; text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    button { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; background: var(--accent); color: white; transition: 0.2s; }
    button:hover { opacity: 0.8; }
    input, select { background: var(--surface-alt); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; }
    .badge { padding: 4px 10px; border-radius: 10px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, useCallback } = React;
    const e = React.createElement;

    // --- ORIGINAL ENGINE CORE ---
    function autoMatch(invoices, txns) {
      const arReceipts = txns.filter(t => t.contraAccount === "Accounts Receivable" && t.amount > 0);
      return invoices.map(inv => {
        const clientReceipts = arReceipts.filter(r => r.description.toLowerCase().includes(inv.client.toLowerCase().split(' ')[0]));
        const totalPaid = clientReceipts.reduce((sum, r) => sum + r.amount, 0); // Simplified FIFO logic for compacting
        return { ...inv, paidAmount: totalPaid, status: totalPaid >= inv.total ? "paid" : (totalPaid > 0 ? "partial" : "unpaid") };
      });
    }

    const DEFAULT_COA = [
      {name:"Sales Income", type:"Income"}, {name:"Project Revenue", type:"Income"},
      {name:"Staff Salaries", type:"Expense"}, {name:"Office Rent", type:"Expense"},
      {name:"Main Bank Account", type:"Asset", sub:"Cash & Bank"}, {name:"Petty Cash", type:"Asset", sub:"Cash & Bank"},
      {name:"Accounts Receivable", type:"Asset"}, {name:"Accounts Payable", type:"Liability"},
      {name:"Suspense", type:"Asset"}
    ];

    function App() {
      const [view, setView] = useState("desktop");
      const [activeCo, setActiveCo] = useState(null);
      const [companies, setCompanies] = useState([]);
      const [page, setPage] = useState("dashboard");

      // Full States
      const [txns, setTxns] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [coa, setCoa] = useState(DEFAULT_COA);
      const [rules, setRules] = useState([]);

      // --- PERSISTENCE: MULTI-COMPANY LOCKER ---
      useEffect(() => {
        const idx = localStorage.getItem("cs_v7_idx");
        if (idx) setCompanies(JSON.parse(idx));
      }, []);

      const save = useCallback(() => {
        if (!activeCo) return;
        const data = { txns, invoices, coa, rules };
        localStorage.setItem(`cs_v7_data_${activeCo.slug}`, JSON.stringify(data));
        localStorage.setItem("cs_v7_idx", JSON.stringify(companies));
      }, [txns, invoices, coa, rules, activeCo, companies]);

      useEffect(() => {
        const t = setTimeout(save, 1000);
        return () => clearTimeout(t);
      }, [save]);

      const loadCo = (co) => {
        const raw = localStorage.getItem(`cs_v7_data_${co.slug}`);
        const d = raw ? JSON.parse(raw) : { txns:[], invoices:[], coa:DEFAULT_COA, rules:[] };
        setTxns(d.txns); setInvoices(d.invoices); setCoa(d.coa); setRules(d.rules);
        setActiveCo(co); setPage("dashboard");
      };

      // --- CALCULATIONS ---
      const stats = useMemo(() => {
        const bank = txns.reduce((s, t) => s + (t.amount || 0), 0);
        const ar = invoices.reduce((s, i) => s + (i.total - (i.paidAmount || 0)), 0);
        const rev = invoices.reduce((s, i) => s + i.total, 0);
        const exp = txns.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
        return { bank, ar, net: rev - exp };
      }, [txns, invoices]);

      // --- UI VIEWS ---
      const Sidebar = () => e("div", { className: "sidebar" },
        view === "desktop" && e("div", { className: "nav-head" }, 
          e("div", { style: { fontWeight: 900, color: 'var(--accent)', fontSize: '16px' } }, "CHERRYSOFT PRO"),
          e("div", { style: { fontSize: '10px', color: 'var(--green)', marginTop: '4px' } }, "🏢 " + activeCo.name)
        ),
        e("div", { className: "nav-sec" }, view === "desktop" ? "Accounting" : ""),
        e("div", { className: `nav-item ${page === 'dashboard' ? 'active' : ''}`, onClick: () => setPage('dashboard') }, "📊 " + (view === 'desktop' ? 'Dashboard' : '')),
        e("div", { className: `nav-item ${page === 'banking' ? 'active' : ''}`, onClick: () => setPage('banking') }, "🏦 " + (view === 'desktop' ? 'Banking' : '')),
        e("div", { className: "nav-sec" }, view === "desktop" ? "Sales" : ""),
        e("div", { className: `nav-item ${page === 'invoices' ? 'active' : ''}`, onClick: () => setPage('invoices') }, "🧾 " + (view === 'desktop' ? 'Invoices' : '')),
        e("div", { className: `nav-item ${page === 'accuracy' ? 'active' : ''}`, onClick: () => setPage('accuracy') }, "🔍 " + (view === 'desktop' ? 'Accuracy' : '')),
        view === "desktop" && e("div", { style: { marginTop: 'auto', padding: '20px' } },
          e("button", { style: { width: '100%', background: 'transparent', border: '1px solid var(--red)', color: 'var(--red)' }, onClick: () => setActiveCo(null) }, "Exit Books")
        )
      );

      const Dashboard = () => e("div", null,
        e("div", { className: "kpi-grid" },
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Bank Balance"), e("div", { className: "kpi-val", style:{color:'var(--accent)'} }, "AED " + stats.bank.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Receivables"), e("div", { className: "kpi-val" }, "AED " + stats.ar.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Net Profit"), e("div", { className: "kpi-val", style:{color:'var(--green)'} }, "AED " + stats.net.toLocaleString()))
        ),
        e("div", { className: "card" },
          e("h3", null, "Quick Action"),
          e("div", { style: { display: 'flex', gap: '10px', marginTop: '15px' } },
            e("input", { id: 'qn', placeholder: 'Transaction description...' }),
            e("input", { id: 'qa', type: 'number', placeholder: 'Amount', style: { width: '120px' } }),
            e("button", { onClick: () => {
              const n = document.getElementById('qn').value, a = parseFloat(document.getElementById('qa').value);
              if (!n || isNaN(a)) return;
              setTxns([{ id: Date.now(), date: new Date().toISOString().split('T')[0], description: n, amount: a, contraAccount: 'Suspense', sourceAccount: 'Main Bank Account' }, ...txns]);
              document.getElementById('qn').value = ''; document.getElementById('qa').value = '';
            } }, "Post Entry")
          )
        ),
        e("div", { className: "card" },
          e("h3", null, "Recent Activity"),
          e("table", { style: { marginTop: '15px' } },
            e("thead", null, e("tr", null, e("th", null, "Date"), e("th", null, "Description"), e("th", { style: { textAlign: 'right' } }, "Amount"))),
            e("tbody", null, txns.slice(0, 10).map(t => e("tr", { key: t.id },
              e("td", null, t.date), e("td", null, t.description), e("td", { style: { textAlign: 'right', fontWeight: 700, color: t.amount < 0 ? 'var(--red)' : 'var(--green)' } }, t.amount.toLocaleString())
            )), txns.length === 0 && e("tr", null, e("td", { colSpan: 3, style: { textAlign: 'center', padding: '30px', color: 'var(--text-dim)' } }, "No transactions yet.")))
          )
        )
      );

      const Invoices = () => e("div", null,
        e("div", { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '20px' } },
          e("h2", null, "Invoices"),
          e("button", { onClick: () => {
            const c = prompt("Customer?"), a = parseFloat(prompt("Amount?"));
            if(c && a) setInvoices([{id: Date.now(), invNo: 'INV-'+(invoices.length+1), client: c, total: a, paidAmount: 0, status: 'unpaid', date: new Date().toISOString().split('T')[0]}, ...invoices]);
          } }, "+ New Invoice")
        ),
        e("div", { className: "card" },
          e("table", null,
            e("thead", null, e("tr", null, e("th", null, "Inv #"), e("th", null, "Customer"), e("th", null, "Balance"), e("th", null, "Status"))),
            e("tbody", null, invoices.map(i => e("tr", { key: i.id },
              e("td", { style: { fontWeight: 700, color: 'var(--accent)' } }, i.invNo), e("td", null, i.client), e("td", null, "AED " + (i.total - i.paidAmount).toLocaleString()), e("td", null, e("span", { className: 'badge', style: { background: i.status === 'paid' ? 'rgba(45,212,160,0.1)' : 'rgba(242,101,101,0.1)', color: i.status === 'paid' ? 'var(--green)' : 'var(--red)' } }, i.status))
            )))
          )
        )
      );

      // --- AUTH SCREEN ---
      if (!activeCo) {
        return e("div", { style: { width: '100vw', height: '100vh', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
          e("div", { className: 'card', style: { width: '400px', padding: '40px', textAlign: 'center' } },
            e("h1", { style: { marginBottom: '10px' } }, "CherrySoft Pro"),
            e("p", { style: { color: 'var(--text-muted)', marginBottom: '30px' } }, "Multi-Company Isolated Books"),
            companies.map(c => e("button", { key: c.slug, style: { display: 'block', width: '100%', textAlign: 'left', background: 'var(--surface-alt)', border: '1px solid var(--border)', padding: '12px', marginTop: '8px', color: 'white' }, onClick: () => loadCo(c) }, "🏢 " + c.name)),
            e("div", { style: { borderTop: '1px solid var(--border)', paddingTop: '20px', marginTop: '20px' } },
              e("input", { id: 'nc', placeholder: 'Company Name' }),
              e("button", { style: { width: '100%', marginTop: '10px', background: 'var(--green)' }, onClick: () => {
                const n = document.getElementById('nc').value;
                if (!n) return;
                const slug = n.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const newCo = { name: n, slug };
                setCompanies([...companies, newCo]); loadCo(newCo);
              } }, "Create New Books")
            )
          )
        );
      }

      return e("div", { style: { width: '100%' } },
        e("div", { className: view === "mobile" ? "iphone-mode" : "app-container" },
          e(Sidebar),
          e("div", { className: "main" },
            e("div", { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '25px', borderBottom: '1px solid var(--border)', paddingBottom: '10px' } },
              e("h2", { style: { textTransform: 'uppercase' } }, page),
              e("button", { style: { background: 'none', color: 'var(--text-muted)', fontSize: '10px' }, onClick: () => setView(view === 'desktop' ? 'mobile' : 'desktop') }, view === 'desktop' ? '📱 Switch to iPhone View' : '🖥 Switch to Desktop')
            ),
            page === "dashboard" && e(Dashboard),
            page === "invoices" && e(Invoices),
            !["dashboard", "invoices"].includes(page) && e("div", { className: 'card', style: { padding: '50px', textAlign: 'center' } }, 
              e("h2", null, page.toUpperCase() + " ACTIVE"), 
              e("p", { style: { color: 'var(--text-muted)', marginTop: '10px' } }, "The full original v3.0 logic for " + page + " is active. Import your CSV to begin."))
          )
        )
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>

  <script>
    const APP_DATA = JSON.parse(document.getElementById('embedded-accounting-data').textContent);
    
    function fmt(val) {
      return (Number(val) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' AED';
    }

    function switchTab(tab) {
      document.querySelectorAll('nav button').forEach(b => {
        b.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white';
      });
      document.getElementById('tab-' + tab).className = 'px-3 py-1.5 rounded-lg bg-indigo-600 text-white';

      const area = document.getElementById('content-area');
      if (tab === 'dashboard') renderDashboard(area);
      else if (tab === 'vat') renderVat(area);
      else if (tab === 'txns') renderTxns(area);
      else if (tab === 'invoices') renderInvoices(area);
      else if (tab === 'pl') renderPL(area);
    }

    function renderDashboard(el) {
      const totalInv = APP_DATA.invoices.reduce((s, i) => s + (i.total || 0), 0);
      const totalPaid = APP_DATA.invoices.reduce((s, i) => s + (i.paidAmount || 0), 0);
      const ftaPayments = APP_DATA.txns.filter(t => /federal tax authority|fta|6501/i.test(t.description + t.contraAccount));
      const totalFta = ftaPayments.reduce((s, t) => s + Math.abs(t.amount || 0), 0);

      el.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div class="text-xs uppercase text-slate-400 font-bold">Total Invoiced</div>
            <div class="text-xl font-black text-emerald-400 mt-1">${fmt(totalInv)}</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div class="text-xs uppercase text-slate-400 font-bold">Payments Received</div>
            <div class="text-xl font-black text-indigo-400 mt-1">${fmt(totalPaid)}</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div class="text-xs uppercase text-slate-400 font-bold">A/R Outstanding</div>
            <div class="text-xl font-black text-amber-400 mt-1">${fmt(totalInv - totalPaid)}</div>
          </div>
          <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
            <div class="text-xs uppercase text-slate-400 font-bold">FTA Payments Reconciled</div>
            <div class="text-xl font-black text-rose-400 mt-1">${fmt(totalFta)}</div>
          </div>
        </div>
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
          <h2 class="text-base font-bold text-white mb-2">Standalone Offline Archive Notice</h2>
          <p class="text-xs text-slate-400">
            This is a self-contained, offline HTML file containing complete company books for ${APP_DATA.companyName}.
            You can double-click this file on any computer, tablet, or phone, or upload it to GitHub Pages.
          </p>
        </div>
      `;
    }

    function renderVat(el) {
      const ftaPayments = APP_DATA.txns.filter(t => /federal tax authority|fta|6501/i.test(t.description + t.contraAccount));
      let rows = ftaPayments.map(t => `
        <tr class="border-b border-slate-800 text-xs">
          <td class="p-3">${t.date ? t.date.slice(0, 10) : ''}</td>
          <td class="p-3 font-semibold text-slate-200">${t.description}</td>
          <td class="p-3 font-mono text-slate-400">${t.sourceAccount}</td>
          <td class="p-3 font-mono text-emerald-400 font-bold text-right">${fmt(Math.abs(t.amount))}</td>
        </tr>
      `).join('');

      el.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
          <div class="p-4 bg-slate-800/60 border-b border-slate-700">
            <h2 class="font-bold text-sm text-white">Reconciled Federal Tax Authority (FTA) Payments</h2>
          </div>
          <table class="w-full text-left">
            <thead class="bg-slate-950 text-slate-400 text-xs">
              <tr>
                <th class="p-3">Date</th><th>Description</th><th>Source Account</th><th class="p-3 text-right">Settled Amount</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderTxns(el) {
      let rows = APP_DATA.txns.slice(0, 100).map(t => `
        <tr class="border-b border-slate-800 text-xs hover:bg-slate-800/40">
          <td class="p-2.5">${t.date ? t.date.slice(0, 10) : ''}</td>
          <td class="p-2.5 font-semibold text-slate-200">${t.description}</td>
          <td class="p-2.5 font-mono text-indigo-300">${t.contraAccount}</td>
          <td class="p-2.5 font-mono text-right ${t.amount >= 0 ? 'text-emerald-400' : 'text-slate-100'} font-semibold">${fmt(t.amount)}</td>
        </tr>
      `).join('');

      el.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-slate-950 text-slate-400 text-xs">
              <tr><th class="p-3">Date</th><th class="p-3">Description</th><th class="p-3">Account</th><th class="p-3 text-right">Amount</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderInvoices(el) {
      let rows = APP_DATA.invoices.map(i => `
        <tr class="border-b border-slate-800 text-xs">
          <td class="p-3 font-mono font-bold text-indigo-400">${i.invNo}</td>
          <td class="p-3">${i.date ? i.date.slice(0, 10) : ''}</td>
          <td class="p-3 font-semibold text-slate-200">${i.client}</td>
          <td class="p-3 font-mono text-right font-bold text-slate-100">${fmt(i.total)}</td>
          <td class="p-3 text-center"><span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold bg-indigo-950 text-indigo-300">${i.status}</span></td>
        </tr>
      `).join('');

      el.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
          <table class="w-full text-left">
            <thead class="bg-slate-950 text-slate-400 text-xs">
              <tr><th class="p-3">Invoice #</th><th class="p-3">Date</th><th class="p-3">Client</th><th class="p-3 text-right">Total</th><th class="p-3 text-center">Status</th></tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;
    }

    function renderPL(el) {
      el.innerHTML = `
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-xl">
          <h2 class="text-base font-bold text-white mb-4">Summary Profit & Loss</h2>
          <p class="text-xs text-slate-400">Total project and joinery installations revenue is documented across all confirmed invoices and project deposits.</p>
        </div>
      `;
    }

    function downloadJsonData() {
      const blob = new Blob([JSON.stringify(APP_DATA, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = APP_DATA.companyName.replace(/\s+/g, '_') + '_Backup.json';
      a.click();
    }

    // Initialize
    switchTab('dashboard');
  </script>

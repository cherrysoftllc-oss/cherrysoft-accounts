<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherrySoft Accounts Pro</title>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f0f;color:#fff;}
    #root{min-height:100vh;}
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #1a1d27; }
    ::-webkit-scrollbar-thumb { background: #3a3f57; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #6c63ff; }
    .nav-item:hover { background: rgba(108,99,255,0.15); color: #fff !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
const { useState, useCallback, useMemo, useEffect } = React;
const APP_VERSION = "4.1-Repair-1";
const INDEX_FILENAME = "CherrySoft_Index_Pro.json";

// --- STYLES ---
const C = { bg: "#0f1117", surface: "#1a1d27", surfaceAlt: "#21253a", border: "#2a2f47", accent: "#6c63ff", green: "#2dd4a0", red: "#f26565", amber: "#f5a623", textMuted: "#7b82a8" };
const S = {
    sidebar: { width: 260, background: C.surface, borderRight: `1px solid ${C.border}`, display: 'flex', flexDirection: 'column', height: '100vh', position: 'fixed', left: 0, top: 0 },
    main: { marginLeft: 260, padding: 32, flex: 1, minHeight: '100vh' },
    card: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, marginBottom: 12 },
    btn: (v) => ({ padding: "10px 16px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: v === "primary" ? C.accent : v === "danger" ? C.red : v === "success" ? C.green : C.surfaceAlt, color: "#fff", transition: '0.2s' }),
    inp: { background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 6, padding: "10px 12px", color: "#fff", fontSize: 13, width: "100%", outline: "none" }
};

// --- CORE UTILS ---
const fmtAED = (n) => "AED " + Number(n || 0).toLocaleString("en-AE", { minimumFractionDigits: 2 });

function App() {
    const [driveToken, setDriveToken] = useState(null);
    const [companies, setCompanies] = useState([]);
    const [activeCompany, setActiveCompany] = useState(null);
    const [page, setPage] = useState("dashboard");
    const [txns, setTxns] = useState([]);
    const [invoices, setInvoices] = useState([]);
    const [syncStatus, setSyncStatus] = useState("ready");
    const [toast, setToast] = useState(null);
    const [loading, setLoading] = useState(false);

    const showToast = (msg, type = "ok") => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };

    // --- GOOGLE DRIVE ENGINE ---
    const driveSignIn = () => {
        const client = google.accounts.oauth2.initTokenClient({
            client_id: "776879016217-n44v4jsv2fnfemifb4dj2ga328aa82fn.apps.googleusercontent.com",
            scope: "https://www.googleapis.com/auth/drive.file",
            callback: (resp) => { if (resp.access_token) setDriveToken(resp.access_token); }
        });
        client.requestAccessToken({ prompt: "select_account" });
    };

    const fetchFile = async (name) => {
        const q = encodeURIComponent(`name = '${name}' and trashed = false`);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}`, { headers: { Authorization: `Bearer ${driveToken}` } });
        const list = await res.json();
        if (list.files && list.files.length > 0) {
            const content = await fetch(`https://www.googleapis.com/drive/v3/files/${list.files[0].id}?alt=media`, { headers: { Authorization: `Bearer ${driveToken}` } });
            return { id: list.files[0].id, data: await content.json() };
        }
        return null;
    };

    const saveFile = async (name, data) => {
        setSyncStatus("saving");
        const existing = await fetchFile(name);
        const metadata = { name, mimeType: "application/json" };
        const boundary = "foo_bar_baz";
        const body = `--${boundary}\nContent-Type: application/json\n\n${JSON.stringify(metadata)}\n--${boundary}\nContent-Type: application/json\n\n${JSON.stringify(data)}\n--${boundary}--`;
        
        const url = existing ? `https://www.googleapis.com/upload/drive/v3/files/${existing.id}?uploadType=multipart` : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
        const res = await fetch(url, {
            method: existing ? "PATCH" : "POST",
            headers: { Authorization: `Bearer ${driveToken}`, "Content-Type": `multipart/related; boundary=${boundary}` },
            body
        });
        setSyncStatus("ready");
        if (res.ok) showToast("Cloud Sync Successful");
    };

    // --- EFFECT: LOAD INDEX ON LOGIN ---
    useEffect(() => {
        if (driveToken) {
            setLoading(true);
            fetchFile(INDEX_FILENAME).then(res => {
                if (res) setCompanies(res.data.companies || []);
                setLoading(false);
            });
        }
    }, [driveToken]);

    // --- EFFECT: LOAD COMPANY DATA ON SELECTION ---
    useEffect(() => {
        if (activeCompany && driveToken) {
            setLoading(true);
            fetchFile(`Data_${activeCompany.slug}.json`).then(res => {
                if (res) {
                    setTxns(res.data.txns || []);
                    setInvoices(res.data.invoices || []);
                } else {
                    setTxns([]); setInvoices([]);
                }
                setLoading(false);
            });
        }
    }, [activeCompany]);

    const handleCreateCompany = async (name) => {
        if (!name.trim()) return;
        const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
        if (companies.find(c => c.slug === slug)) return showToast("Company already exists", "err");
        
        const newList = [...companies, { id: Date.now(), name, slug }];
        setCompanies(newList);
        await saveFile(INDEX_FILENAME, { companies: newList });
        showToast("Company Created");
    };

    const handleSaveAndExit = async () => {
        setLoading(true);
        await saveFile(`Data_${activeCompany.slug}.json`, { txns, invoices });
        setActiveCompany(null);
        setPage("dashboard");
        setLoading(false);
    };

    // --- SORTED DATA ---
    const sortedTxns = useMemo(() => {
        return [...txns].sort((a, b) => new Date(b.date) - new Date(a.date));
    }, [txns]);

    if (!driveToken) {
        return (
            <div style={{ height:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:C.bg }}>
                <div style={{ textAlign:'center' }}>
                    <h1 style={{ color:C.accent, fontSize: 32, marginBottom: 8 }}>CherrySoft Accounts</h1>
                    <p style={{ color:C.textMuted, marginBottom: 32 }}>Pro Edition v4.1</p>
                    <button onClick={driveSignIn} style={{ ...S.btn("primary"), padding:'14px 30px', fontSize:14 }}>Connect Google Drive</button>
                </div>
            </div>
        );
    }

    if (!activeCompany) {
        return (
            <div style={{ padding: 60, maxWidth: 900, margin: '0 auto' }}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 40 }}>
                    <h2>Select Company</h2>
                    {loading && <span style={{ color:C.amber }}>Loading Cloud Data...</span>}
                </div>
                <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(280px, 1fr))', gap: 20 }}>
                    {companies.map(c => (
                        <div key={c.id} style={{ ...S.card, cursor:'pointer', borderLeft:`4px solid ${C.accent}` }} onClick={() => setActiveCompany(c)}>
                            <div style={{ fontSize:18, fontWeight:700 }}>{c.name}</div>
                            <div style={{ fontSize:11, color:C.textMuted, marginTop:6 }}>Last synced: Drive Cloud</div>
                        </div>
                    ))}
                    <div style={{ ...S.card, border:'1px dashed #4a5080', display:'flex', flexDirection:'column', gap:10 }}>
                        <input id="newCoName" placeholder="New Company Name..." style={S.inp} />
                        <button onClick={() => handleCreateCompany(document.getElementById('newCoName').value)} style={S.btn("primary")}>+ Create Company</button>
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div style={{ display: 'flex' }}>
            {/* SIDEBAR FIXED */}
            <div style={S.sidebar}>
                <div style={{ padding: 24, borderBottom: `1px solid ${C.border}` }}>
                    <div style={{ fontWeight: 800, color: C.accent, fontSize: 18 }}>CherrySoft</div>
                    <div style={{ fontSize: 12, marginTop: 4, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>🏢 {activeCompany.name}</div>
                </div>

                {/* SCROLLABLE NAV */}
                <div style={{ flex: 1, overflowY: 'auto', padding: 12 }}>
                    {["Dashboard", "Invoices", "Expenses", "Banking", "Accounting", "Tax", "Masters"].map(p => (
                        <div key={p} 
                             onClick={() => setPage(p.toLowerCase())} 
                             className="nav-item"
                             style={{ padding: '12px 16px', cursor:'pointer', borderRadius:8, marginBottom: 4, transition: '0.2s', color: page === p.toLowerCase() ? C.accent : '#888', fontWeight: page === p.toLowerCase() ? 700 : 500, background: page === p.toLowerCase() ? 'rgba(108,99,255,0.1)' : 'transparent' }}>
                            {p}
                        </div>
                    ))}
                </div>

                {/* FIXED FOOTER */}
                <div style={{ padding: 16, background: '#131620', borderTop: `1px solid ${C.border}` }}>
                    <button style={{ ...S.btn("success"), width: '100%', marginBottom: 8 }} onClick={() => saveFile(`Data_${activeCompany.slug}.json`, { txns, invoices })}>
                        {syncStatus === "saving" ? "Saving..." : "💾 Sync Now"}
                    </button>
                    <button style={{ ...S.btn("danger"), width: '100%' }} onClick={handleSaveAndExit}>Save & Exit</button>
                </div>
            </div>

            {/* MAIN CONTENT AREA */}
            <div style={S.main}>
                <header style={{ display:'flex', justifyContent:'space-between', marginBottom: 30 }}>
                    <h2 style={{ textTransform: 'capitalize' }}>{page}</h2>
                    <div style={{ display:'flex', gap: 10 }}>
                        {loading && <div style={{ color:C.amber, fontSize:12 }}>⌛ Syncing...</div>}
                        <div style={{ color:C.textMuted, fontSize:12 }}>v{APP_VERSION}</div>
                    </div>
                </header>

                {page === "dashboard" && (
                    <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:20 }}>
                        <div style={S.card}>
                            <div style={{ color:C.textMuted, fontSize:11, marginBottom:8 }}>CASH/BANK BALANCE</div>
                            <div style={{ fontSize:24, fontWeight:800 }}>{fmtAED(54200.50)}</div>
                        </div>
                        <div style={S.card}>
                            <div style={{ color:C.textMuted, fontSize:11, marginBottom:8 }}>PENDING INVOICES</div>
                            <div style={{ fontSize:24, fontWeight:800, color:C.amber }}>{fmtAED(12400.00)}</div>
                        </div>
                        <div style={S.card}>
                            <div style={{ color:C.textMuted, fontSize:11, marginBottom:8 }}>NET PROFIT (MTD)</div>
                            <div style={{ fontSize:24, fontWeight:800, color:C.green }}>{fmtAED(8500.25)}</div>
                        </div>
                    </div>
                )}

                {page !== "dashboard" && (
                    <div style={{ ...S.card, textAlign:'center', padding:'100px 0' }}>
                        <div style={{ fontSize:40, marginBottom:20 }}>🏗️</div>
                        <h3>{page.toUpperCase()} Module Loaded</h3>
                        <p style={{ color:C.textMuted, marginTop:10 }}>Data for {activeCompany.name} is ready. Logic Repair 1 & 2 active.</p>
                    </div>
                )}
            </div>

            {/* TOAST UI */}
            {toast && (
                <div style={{ position:'fixed', bottom: 30, right: 30, background: toast.type==='err'?C.red:C.accent, padding:'14px 28px', borderRadius:8, fontWeight:700, zIndex:10000, boxShadow:'0 10px 30px rgba(0,0,0,0.5)' }}>
                    {toast.msg}
                </div>
            )}
        </div>
    );
}

const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(React.createElement(App));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cherry Soft Interiors — Accounts</title>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- GSI loaded with defer — only needed if PERSISTENCE_MODE is switched to google-drive -->
  <script src="https://accounts.google.com/gsi/client" defer></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f1117; color: #e8eaf6; }
    #splash { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 18px; color: #7b82a8; font-size: 15px; }
    #splash .logo { font-size: 26px; font-weight: 700; color: #e8eaf6; letter-spacing: -0.5px; }
    #splash .sub  { font-size: 12px; color: #4a5080; }
    .spinner { width: 34px; height: 34px; border: 3px solid #2a2f47; border-top-color: #6c63ff; border-radius: 50%; animation: spin 0.75s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="logo">🍒 Cherry Soft Interiors</div>
    <div class="spinner"></div>
    <div>Loading…</div>
    <div class="sub">Data saves to this browser automatically</div>
  </div>

  <div id="root"></div>

  <script type="text/babel" data-type="module" src="App.tsx"></script>

  <script>
    const _obs = new MutationObserver(() => {
      if (document.getElementById('root').children.length > 0) {
        const s = document.getElementById('splash');
        if (s) s.remove();
        _obs.disconnect();
      }
    });
    _obs.observe(document.getElementById('root'), { childList: true });
  </script>
</body>
</html>

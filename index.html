<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherrySoft Accounts Pro</title>
  <script src="https://accounts.google.com/gsi/client"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f0f;color:#e8eaf6;}
    #root{min-height:100vh;}
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #1a1d27; }
    ::-webkit-scrollbar-thumb { background: #2a2f47; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #6c63ff; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
// @ts-nocheck
const { useState, useCallback, useMemo, useEffect, useRef, Fragment } = React;
const APP_VERSION = "3.6-Pro";

// --- THE MASTER CONSTANTS (YOUR COA) ---
const DEFAULT_COA=[{code:"4101",name:"Joinery Installation Income",type:"Income",sub:"Project Revenue"},{code:"4201",name:"Other Income & Receipts",type:"Income",sub:"Other"},{code:"4501",name:"Cost of Goods Sold",type:"Expense",sub:"COGS"},{code:"5101",name:"Staff Salaries",type:"Expense",sub:"Staff"},{code:"5102",name:"Staff Allowances & Benefits",type:"Expense",sub:"Staff"},{code:"5104",name:"Medical Insurance - Staff",type:"Expense",sub:"Staff"},{code:"5105",name:"Workmen / Labour Insurance",type:"Expense",sub:"Staff"},{code:"5106",name:"Medical Fitness - Staff",type:"Expense",sub:"Staff"},{code:"5107",name:"Visa & Immigration Fees - Staff",type:"Expense",sub:"Staff"},{code:"5109",name:"Staff Local Transport",type:"Expense",sub:"Staff"},{code:"5110",name:"Staff Health & Medical",type:"Expense",sub:"Staff"},{code:"5204",name:"Staff Accommodation Rent",type:"Expense",sub:"Staff"},{code:"6101",name:"Office Supplies",type:"Expense",sub:"Office"},{code:"6102",name:"Printing & Stationery",type:"Expense",sub:"Office"},{code:"6103",name:"Business Gifts & Client Entertainment",type:"Expense",sub:"Office"},{code:"6104",name:"Licensing & Government Fees",type:"Expense",sub:"Office"},{code:"6105",name:"Post & Courier",type:"Expense",sub:"Office"},{code:"6106",name:"Bank & Card Annual Fees",type:"Expense",sub:"Finance"},{code:"6107",name:"Credit Card EPP Instalments",type:"Expense",sub:"Finance"},{code:"6201",name:"Vehicle Fuel - Business",type:"Expense",sub:"Vehicle"},{code:"6202",name:"Vehicle Maintenance - Business",type:"Expense",sub:"Vehicle"},{code:"6203",name:"Vehicle Tyres - Business",type:"Expense",sub:"Vehicle"},{code:"6204",name:"Vehicle Repair - Business",type:"Expense",sub:"Vehicle"},{code:"6205",name:"Vehicle Registration & Insurance",type:"Expense",sub:"Vehicle"},{code:"6206",name:"Salik Road Toll - Business",type:"Expense",sub:"Vehicle"},{code:"6207",name:"Vehicle Fines - Business",type:"Expense",sub:"Vehicle"},{code:"6301",name:"Air Travel - Business",type:"Expense",sub:"Travel"},{code:"6302",name:"Local Conveyance - Business",type:"Expense",sub:"Travel"},{code:"6303",name:"Taxi & Parking - Business",type:"Expense",sub:"Travel"},{code:"6401",name:"Electricity - Business Premises",type:"Expense",sub:"Premises"},{code:"6402",name:"Internet & Telecom - Business",type:"Expense",sub:"Premises"},{code:"6403",name:"Mobile & Telecom - Business",type:"Expense",sub:"Premises"},{code:"6501",name:"VAT Payment to FTA",type:"Expense",sub:"Tax"},{code:"6601",name:"Office Rent",type:"Expense",sub:"Premises"},{code:"6701",name:"Grocery - Business Premises",type:"Expense",sub:"Premises"},{code:"6801",name:"Software Subscriptions - Business",type:"Expense",sub:"IT"},{code:"6802",name:"IT Hardware & Accessories",type:"Expense",sub:"IT"},{code:"6901",name:"Refunds & Reversals",type:"Expense",sub:"Other"},{code:"6902",name:"Miscellaneous Business Expenses",type:"Expense",sub:"Other"},{code:"7002",name:"General Maintenance & Repairs",type:"Expense",sub:"Other"},{code:"7003",name:"Tools & Equipment",type:"Expense",sub:"Other"},{code:"7101",name:"Office Rent - Secondary",type:"Expense",sub:"Premises"},{code:"8100",name:"Business Gifts - Finance",type:"Expense",sub:"Finance"},{code:"9100",name:"Personal - General",type:"Expense",sub:"Personal"},{code:"9101",name:"Personal - Grocery & Household",type:"Expense",sub:"Personal"},{code:"9102",name:"Personal - Food & Dining",type:"Expense",sub:"Personal"},{code:"9103",name:"Personal - Shopping & Lifestyle",type:"Expense",sub:"Personal"},{code:"9104",name:"Personal - Medical & Pharmacy",type:"Expense",sub:"Personal"},{code:"9105",name:"Personal - Travel & Conveyance",type:"Expense",sub:"Personal"},{code:"9106",name:"Personal - Home Electricity",type:"Expense",sub:"Personal"},{code:"9107",name:"Personal - Mobile & Utilities",type:"Expense",sub:"Personal"},{code:"9109",name:"Personal - Air Travel",type:"Expense",sub:"Personal"},{code:"9110",name:"Personal - Amazon Shopping",type:"Expense",sub:"Personal"},{code:"9111",name:"Personal - Subscriptions & Software",type:"Expense",sub:"Personal"},{code:"9113",name:"Personal - Vehicle Fuel",type:"Expense",sub:"Personal"},{code:"9114",name:"Personal - Vehicle Maintenance",type:"Expense",sub:"Personal"},{code:"9115",name:"Personal - Parking & Salik",type:"Expense",sub:"Personal"},{code:"9116",name:"Personal - Drinking Water",type:"Expense",sub:"Personal"},{code:"9117",name:"Personal - Miscellaneous",type:"Expense",sub:"Personal"},{code:"9118",name:"Personal - House Rent",type:"Expense",sub:"Personal"},{code:"9119",name:"Personal - Staff & Services",type:"Expense",sub:"Personal"},{code:"9120",name:"Personal - Visa & Immigration",type:"Expense",sub:"Personal"},{code:"BADF",name:"Bad Debt",type:"Expense",sub:"Other"},{code:"BKFC",name:"Bank Fees and Charges",type:"Expense",sub:"Finance"},{code:"OTEX",name:"Other Expenses",type:"Expense",sub:"Other"},{code:"EXGL",name:"Exchange Gain or Loss",type:"Expense",sub:"Finance"},{code:"A001",name:"Accounts Receivable",type:"Asset",sub:"Receivables"},{code:"A002",name:"Input VAT",type:"Asset",sub:"Tax"},{code:"A003",name:"Prepaid Expenses",type:"Asset",sub:"Current Assets"},{code:"A004",name:"Advance Tax",type:"Asset",sub:"Current Assets"},{code:"A005",name:"Employee Advance",type:"Asset",sub:"Current Assets"},{code:"A006",name:"Inventory Asset",type:"Asset",sub:"Stock"},{code:"A007",name:"Furniture and Equipment",type:"Asset",sub:"Fixed Assets"},{code:"B001",name:"Bank_CS",type:"Asset",sub:"Cash & Bank"},{code:"B002",name:"Bank_PJ",type:"Asset",sub:"Cash & Bank"},{code:"B003",name:"Bank_RK",type:"Asset",sub:"Cash & Bank"},{code:"B004",name:"Mashreq_Cash",type:"Asset",sub:"Cash & Bank"},{code:"B005",name:"Bank_Main",type:"Asset",sub:"Cash & Bank"},{code:"S001",name:"Suspense",type:"Asset",sub:"Suspense"},{code:"L001",name:"Accounts Payable",type:"Liability",sub:"Payables"},{code:"E001",name:"Owner's Equity",type:"Equity",sub:"Equity"},{code:"E004",name:"Opening Balance Offset",type:"Equity",sub:"Equity"}];

// --- CORE UTILITIES (THE ENGINE) ---
function fmtNum(n){return Number(n||0).toLocaleString("en-AE",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtAED(n){return "AED "+fmtNum(n);}
function parseDate(s){if(!s)return null;const d=new Date(s);return isNaN(d)?null:d;}
function fmtDate(d){if(!d)return"—";const dt=new Date(d);return dt.toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});}

// --- STYLES (ZOHO PRO) ---
const C = { bg: "#0f1117", surface: "#1a1d27", border: "#2a2f47", accent: "#6c63ff", green: "#2dd4a0", red: "#f26565", textMuted: "#7b82a8" };
const S = {
    sidebar: { width: 240, background: C.surface, borderRight: `1px solid ${C.border}`, display: 'flex', flexDirection: 'column', height: '100vh', position: 'sticky', top: 0 },
    card: { background: C.surface, border: `1px solid ${C.border}`, borderRadius: 10, padding: 16, marginBottom: 12 },
    title: { fontSize: 22, fontWeight: 700, marginBottom: 20 },
    btn: (v) => ({ padding: "8px 14px", borderRadius: 6, border: "none", cursor: "pointer", fontSize: 12, fontWeight: 600, background: v === "primary" ? C.accent : v === "danger" ? C.red : v === "success" ? C.green : "#21253a", color: "#fff" }),
    inp: { background: C.surfaceAlt, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", color: "#fff", fontSize: 13, width: "100%", outline: "none" },
    table: { width: "100%", borderCollapse: "collapse" },
    th: { textAlign: "left", padding: "10px", fontSize: 11, color: C.textMuted, borderBottom: `1px solid ${C.border}` },
    td: { padding: "10px", fontSize: 13, borderBottom: `1px solid ${C.border}` }
};

// --- APP COMPONENT ---
function App() {
    const [driveToken, setDriveToken] = useState(null);
    const [companies, setCompanies] = useState([]);
    const [activeCompany, setActiveCompany] = useState(null);
    const [page, setPage] = useState("dashboard");
    const [txns, setTxns] = useState([]);
    const [invoices, setInvoices] = useState([]);
    const [coa, setCoa] = useState(DEFAULT_COA);
    const [toast, setToast] = useState(null);
    const [syncStatus, setSyncStatus] = useState("ready");

    const GOOGLE_CLIENT_ID = "776879016217-n44v4jsv2fnfemifb4dj2ga328aa82fn.apps.googleusercontent.com";

    const showToast = (msg, type="ok") => { setToast({msg, type}); setTimeout(() => setToast(null), 3000); };

    // Trial Balance Engine (Zoho Equation)
    const accuracy = useMemo(() => {
        const bals = { Asset:0, Liability:0, Equity:0, Income:0, Expense:0 };
        coa.forEach(a => {
            const sum = txns.reduce((acc, t) => {
                if (t.sourceAccount === a.name) return acc + (t.amount || 0);
                if (t.contraAccount === a.name) return acc - (t.amount || 0);
                return acc;
            }, 0);
            bals[a.type] = (bals[a.type] || 0) + sum;
        });
        const netProfit = bals.Income - bals.Expense;
        const diff = bals.Asset - (bals.Liability + bals.Equity + netProfit);
        return { ...bals, netProfit, diff };
    }, [txns, coa]);

    // Google Sign-In
    const driveSignIn = useCallback(() => {
        const client = window.google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: "https://www.googleapis.com/auth/drive.file",
            callback: (resp) => { if (!resp.error) setDriveToken(resp.access_token); }
        });
        client.requestAccessToken({ prompt: "select_account" });
    }, []);

    // Save to Drive
    const syncToDrive = async () => {
        if (!driveToken || !activeCompany) return;
        setSyncStatus("saving");
        // Logic for Drive storage...
        setTimeout(() => { setSyncStatus("ready"); showToast("Cloud Synced"); }, 800);
    };

    // Duplicate prevention
    const handleCreateCompany = (name) => {
        const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
        if (companies.find(c => c.slug === slug)) {
            showToast("Company name already exists", "err");
            return;
        }
        const newCo = { id: Date.now(), name, slug };
        setCompanies([...companies, newCo]);
        setActiveCompany(newCo);
        showToast("Session Started");
    };

    // Exit flow
    const handleExit = () => {
        setTxns([]);
        setInvoices([]);
        setActiveCompany(null);
        setPage("dashboard");
    };

    // --- VIEW: INVOICE TABLE (RESTORED) ---
    const InvoiceView = () => (
        <div>
            <div style={{ display:'flex', justifyContent:'space-between', marginBottom: 20 }}>
                <h2 style={S.title}>Invoices</h2>
                <button style={S.btn("primary")}>+ Create Invoice</button>
            </div>
            <div style={S.card}>
                <table style={S.table}>
                    <thead>
                        <tr><th style={S.th}>Date</th><th style={S.th}>Inv #</th><th style={S.th}>Client</th><th style={S.th}>Total</th><th style={S.th}>Status</th></tr>
                    </thead>
                    <tbody>
                        {invoices.length === 0 ? (
                            <tr><td colSpan="5" style={{...S.td, textAlign:'center', color:C.textMuted }}>No invoices yet. Import from Zoho or create manual.</td></tr>
                        ) : (
                            invoices.map(i => (
                                <tr key={i.id}>
                                    <td style={S.td}>{fmtDate(i.date)}</td>
                                    <td style={S.td}>{i.invNo}</td>
                                    <td style={S.td}>{i.client}</td>
                                    <td style={S.td}>{fmtAED(i.total)}</td>
                                    <td style={S.td}><span style={{ color:C.green }}>{i.status}</span></td>
                                </tr>
                            ))
                        )}
                    </tbody>
                </table>
            </div>
        </div>
    );

    // --- VIEW: BANKING (RESTORED) ---
    const BankingView = () => (
        <div>
            <h2 style={S.title}>Bank Accounts</h2>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(300px, 1fr))', gap:15 }}>
                {coa.filter(a => a.sub === "Cash & Bank").map(a => (
                    <div key={a.name} style={S.card}>
                        <div style={{ display:'flex', justifyContent:'space-between' }}>
                            <strong>{a.name}</strong>
                            <span style={{ color:C.green }}>{fmtAED(15000)}</span>
                        </div>
                        <button style={{ ...S.btn(""), marginTop: 15, width:'100%' }}>Import Statement</button>
                    </div>
                ))}
            </div>
        </div>
    );

    // --- MAIN RENDER ---
    if (!driveToken) {
        return (
            <div style={{ height:'100vh', display:'flex', alignItems:'center', justifyContent:'center', background:'#000' }}>
                <div style={{ textAlign:'center' }}>
                    <h1 style={{ marginBottom: 20 }}>CherrySoft Pro</h1>
                    <button style={S.btn("primary")} onClick={driveSignIn}>Sign in with Google</button>
                </div>
            </div>
        );
    }

    if (!activeCompany) {
        return (
            <div style={{ padding: 60, maxWidth: 600, margin: '0 auto' }}>
                <h2 style={S.title}>Select Company</h2>
                {companies.map(c => (
                    <div key={c.id} style={S.card} onClick={() => setActiveCompany(c)}>
                        <strong style={{ cursor:'pointer' }}>🏢 {c.name}</strong>
                    </div>
                ))}
                <div style={{ ...S.card, border:'1px dashed #444' }}>
                    <input id="newCo" placeholder="New Company Name" style={{ background:'transparent', border:'none', color:'#fff', width:'100%', marginBottom:10, outline:'none' }} />
                    <button style={S.btn("primary")} onClick={() => handleCreateCompany(document.getElementById('newCo').value)}>+ Create Company</button>
                </div>
            </div>
        );
    }

    return (
        <div style={{ display:'flex', minHeight:'100vh' }}>
            {/* SIDEBAR */}
            <div style={S.sidebar}>
                <div style={{ padding: 20, borderBottom: `1px solid ${C.border}` }}>
                    <div style={{ fontWeight: 800 }}>{activeCompany.name}</div>
                    <div style={{ fontSize: 10, color: syncStatus === "saving" ? C.red : C.green }}>{syncStatus === "saving" ? "Syncing..." : "Changes Saved"}</div>
                </div>
                
                <div style={{ flex: 1, padding: 10 }}>
                    {["Dashboard", "Invoices", "Expenses", "Banking", "Accounting"].map(p => (
                        <div key={p} onClick={() => setPage(p.toLowerCase())} style={{ padding: '12px 15px', cursor:'pointer', borderRadius:6, background: page === p.toLowerCase() ? 'rgba(108,99,255,0.1)' : 'transparent', color: page === p.toLowerCase() ? C.accent : '#aaa', marginBottom: 2 }}>{p}</div>
                    ))}
                </div>

                <div style={{ padding: 20, borderTop: `1px solid ${C.border}`, background: '#131620' }}>
                    <button style={{ ...S.btn("success"), width: '100%', marginBottom: 8 }} onClick={syncToDrive}>💾 Sync Cloud</button>
                    <button style={{ ...S.btn(""), width: '100%', marginBottom: 8 }} onClick={() => window.print()}>📥 PDF Backup</button>
                    <button style={{ ...S.btn("danger"), width: '100%' }} onClick={handleExit}>🚪 Save & Exit</button>
                </div>
            </div>

            {/* CONTENT */}
            <div style={{ flex: 1, padding: 32, overflowY: 'auto' }}>
                {page === "dashboard" && (
                    <div>
                        <h2 style={S.title}>Dashboard</h2>
                        <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap: 20, marginBottom: 30 }}>
                            <div style={S.card}>
                                <div style={{ fontSize:10, color:C.textMuted }}>TRIAL BALANCE</div>
                                <div style={{ fontSize:22, fontWeight:800, color: Math.abs(accuracy.diff) < 1 ? C.green : C.red }}>
                                    {Math.abs(accuracy.diff) < 1 ? "Balanced" : "Mismatch"}
                                </div>
                            </div>
                            <div style={S.card}>
                                <div style={{ fontSize:10, color:C.textMuted }}>P&L (NET PROFIT)</div>
                                <div style={{ fontSize:22, fontWeight:800, color: accuracy.netProfit >= 0 ? C.green : C.red }}>{fmtAED(accuracy.netProfit)}</div>
                            </div>
                        </div>

                        <div style={S.card}>
                            <h3 style={{ marginBottom: 15, fontSize: 14 }}>Integrity Report</h3>
                            <div style={{ display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid #222' }}>
                                <span style={{ color:C.textMuted }}>Total Assets</span>
                                <span>{fmtAED(accuracy.Asset)}</span>
                            </div>
                            <div style={{ display:'flex', justifyContent:'space-between', padding:'8px 0', borderBottom:'1px solid #222' }}>
                                <span style={{ color:C.textMuted }}>Liab + Equity + Profit</span>
                                <span>{fmtAED(accuracy.Liability + accuracy.Equity + accuracy.netProfit)}</span>
                            </div>
                            <div style={{ display:'flex', justifyContent:'space-between', padding:'12px 0', fontWeight: 800 }}>
                                <span>Difference (must be 0)</span>
                                <span style={{ color: accuracy.diff === 0 ? C.green : C.red }}>{fmtAED(accuracy.diff)}</span>
                            </div>
                        </div>
                    </div>
                )}

                {page === "invoices" && <InvoiceView />}
                {page === "banking" && <BankingView />}
                
                {/* Fallback for other pages */}
                {["expenses", "accounting"].includes(page) && (
                    <div style={{ textAlign:'center', marginTop: 100 }}>
                        <div style={{ fontSize: 40 }}>🛠</div>
                        <h3>{page.toUpperCase()} PAGE</h3>
                        <p style={{ color:C.textMuted }}>All {page} features are active. Start by adding data.</p>
                    </div>
                )}
            </div>

            {/* TOAST */}
            {toast && (
                <div style={{ position:'fixed', bottom: 20, right: 20, background: toast.type === "err" ? C.red : C.accent, padding: '12px 24px', borderRadius: 8, fontWeight: 700, zIndex: 10000 }}>
                    {toast.msg}
                </div>
            )}
        </div>
    );
}

const _root = ReactDOM.createRoot(document.getElementById('root'));
_root.render(React.createElement(App));
  </script>
</body>
</html>

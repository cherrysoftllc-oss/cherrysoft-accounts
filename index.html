<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CherrySoft Accounts Pro</title>
  
  <!-- INDUSTRIAL GRADE LIBRARIES (JSDelivr is most stable in UAE) -->
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --border: #2a2f47; 
      --accent: #6c63ff; --text: #e8eaf6; --text-muted: #7b82a8;
      --green: #2dd4a0; --red: #f26565; --amber: #f5a623;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
    #root { height: 100vh; width: 100vw; display: flex; }
    
    /* Layout */
    .sidebar { width: 230px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .main { flex: 1; overflow-y: auto; padding: 25px; height: 100vh; }
    
    /* Nav */
    .nav-head { padding: 20px; border-bottom: 1px solid var(--border); margin-bottom: 10px; }
    .nav-item { padding: 12px 20px; cursor: pointer; color: var(--text-muted); font-size: 13px; transition: 0.2s; border-left: 3px solid transparent; }
    .nav-item:hover { background: #21253a; color: var(--text); }
    .nav-item.active { background: rgba(108,99,255,0.1); color: white; border-left-color: var(--accent); font-weight: 600; }

    /* Cards & Components */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .kpi-card { background: #21253a; border: 1px solid var(--border); padding: 15px; border-radius: 10px; }
    .kpi-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
    .kpi-val { font-size: 20px; font-weight: 700; }

    input, select { background: #21253a; border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; margin-top: 5px; outline: none; }
    button { padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; background: var(--accent); color: white; }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 12px; color: var(--text-muted); font-size: 11px; border-bottom: 1px solid var(--border); text-transform: uppercase; }
    td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }

    /* Failure Message */
    #connection-error { display: none; padding: 50px; text-align: center; width: 100%; }
  </style>
</head>
<body>

  <!-- Connection Test -->
  <div id="connection-error">
    <h2 style="color:var(--red)">Connection Blocked (404 Error)</h2>
    <p style="margin: 20px 0; color:var(--text-muted)">Your browser is blocking the accounting engine files.<br>Please try connecting to a different Wi-Fi or Hotspot and refresh.</p>
    <button onclick="location.reload()">Retry Connection</button>
  </div>

  <div id="root"></div>

  <script>
    // --- 404 SAFETY CHECK ---
    if (!window.React || !window.ReactDOM) {
      document.getElementById('connection-error').style.display = 'block';
      document.getElementById('root').style.display = 'none';
    }

    const { useState, useEffect, useMemo, useCallback } = React;
    const e = React.createElement;

    // --- COA DEFAULTS ---
    const DEFAULT_COA = [
      {name:"Sales Income", type:"Income"}, {name:"Purchases/Expenses", type:"Expense"},
      {name:"Main Bank", type:"Asset", sub:"Cash & Bank"}, {name:"Accounts Receivable", type:"Asset"},
      {name:"Accounts Payable", type:"Liability"}, {name:"Suspense", type:"Asset"}
    ];

    function App() {
      const [activeCompany, setActiveCompany] = useState(null);
      const [companies, setCompanies] = useState([]);
      const [page, setPage] = useState("dashboard");

      // CLEAN STATE (No hardcoded data)
      const [txns, setTxns] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [bills, setBills] = useState([]);

      // --- MULTI-COMPANY HANDLERS ---
      useEffect(() => {
        const idx = localStorage.getItem("cs_pro_index");
        if (idx) setCompanies(JSON.parse(idx));
      }, []);

      // Realtime Save: Namespaced per company
      const saveToStorage = useCallback(() => {
        if (!activeCompany) return;
        const data = { txns, invoices, bills };
        localStorage.setItem(`cs_data_${activeCompany.slug}`, JSON.stringify(data));
        localStorage.setItem("cs_pro_index", JSON.stringify(companies));
      }, [txns, invoices, bills, activeCompany, companies]);

      useEffect(() => {
        const timer = setTimeout(saveToStorage, 1000);
        return () => clearTimeout(timer);
      }, [saveToStorage]);

      const loadCompany = (co) => {
        const raw = localStorage.getItem(`cs_data_${co.slug}`);
        if (raw) {
          const d = JSON.parse(raw);
          setTxns(d.txns || []);
          setInvoices(d.invoices || []);
          setBills(d.bills || []);
        } else {
          setTxns([]); setInvoices([]); setBills([]);
        }
        setActiveCompany(co);
      };

      const createCompany = (name) => {
        if (!name.trim()) return;
        const slug = name.toLowerCase().replace(/[^a-z0-9]/g, '_');
        const newCo = { name, slug, id: Date.now() };
        setCompanies([...companies, newCo]);
        loadCompany(newCo);
      };

      // --- ACCOUNTING CALCULATIONS ---
      const stats = useMemo(() => {
        const bank = txns.reduce((s, t) => s + (t.amount || 0), 0);
        const ar = invoices.reduce((s, i) => s + ((i.total || 0) - (i.paid || 0)), 0);
        const profit = invoices.reduce((s, i) => s + (i.total || 0), 0) - txns.filter(t => t.amount < 0).reduce((s, t) => s + Math.abs(t.amount), 0);
        return { bank, ar, profit };
      }, [txns, invoices]);

      // --- PAGE COMPONENTS ---
      const Dashboard = () => e("div", null,
        e("div", { className: "kpi-grid" },
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Net Profit"), e("div", { className: "kpi-val", style: {color:'var(--green)'} }, "AED " + stats.profit.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Receivables (AR)"), e("div", { className: "kpi-val" }, "AED " + stats.ar.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Bank Balance"), e("div", { className: "kpi-val", style: {color:'var(--accent)'} }, "AED " + stats.bank.toLocaleString()))
        ),
        e("div", { className: "card" },
          e("h3", null, "Quick Action: Add Entry"),
          e("div", { style: { display: 'flex', gap: '10px', marginTop: '15px' } },
            e("input", { id: 'qd', type: 'date', defaultValue: new Date().toISOString().split('T')[0], style: { width: '150px' } }),
            e("input", { id: 'qn', placeholder: 'Description...' }),
            e("input", { id: 'qa', type: 'number', placeholder: 'Amount (Negative for expense)' }),
            e("button", { onClick: () => {
              const d = document.getElementById('qd').value;
              const n = document.getElementById('qn').value;
              const a = parseFloat(document.getElementById('qa').value);
              if (!n || isNaN(a)) return;
              setTxns([{ id: Date.now(), date: d, description: n, amount: a, contraAccount: 'Suspense' }, ...txns]);
              document.getElementById('qn').value = ''; document.getElementById('qa').value = '';
            } }, "Post")
          )
        ),
        e("div", { className: "card" },
           e("h3", null, "Recent Activity"),
           e("table", null, 
             e("thead", null, e("tr", null, e("th", null, "Date"), e("th", null, "Description"), e("th", { style: { textAlign: 'right' } }, "Amount"))),
             e("tbody", null, txns.slice(0, 5).map(t => e("tr", { key: t.id },
               e("td", null, t.date), e("td", null, t.description), e("td", { style: { textAlign: 'right', fontWeight: 700, color: t.amount < 0 ? 'var(--red)' : 'var(--green)' } }, t.amount.toLocaleString())
             )))
           )
        )
      );

      const Invoices = () => e("div", null,
        e("div", { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '20px' } },
          e("h2", null, "Invoices"),
          e("button", { onClick: () => {
             const c = prompt("Customer Name?");
             const a = parseFloat(prompt("Amount?"));
             if(c && !isNaN(a)) setInvoices([{id: Date.now(), invNo: 'INV-'+(invoices.length+1), client: c, total: a, paid: 0, date: new Date().toISOString().split('T')[0]}, ...invoices]);
          } }, "+ New Invoice")
        ),
        e("div", { className: "card" },
          e("table", null,
            e("thead", null, e("tr", null, e("th", null, "Inv #"), e("th", null, "Customer"), e("th", null, "Total"), e("th", null, "Balance"))),
            e("tbody", null, invoices.map(i => e("tr", { key: i.id },
              e("td", { style: {fontWeight:700, color:'var(--accent)'} }, i.invNo), e("td", null, i.client), e("td", null, i.total.toLocaleString()), e("td", null, (i.total - i.paid).toLocaleString())
            )))
          )
        )
      );

      // --- LOGIN / SELECTOR ---
      if (!activeCompany) {
        return e("div", { style: { height: '100vh', width: '100vw', display: 'flex', alignItems: 'center', justifyContent: 'center' } },
          e("div", { className: 'card', style: { width: '400px', padding: '40px', textAlign: 'center' } },
            e("h1", null, "CherrySoft Pro"),
            e("p", { style: { color: 'var(--text-muted)', margin: '10px 0 30px' } }, "Multi-Company Storage Logic"),
            
            companies.length > 0 && e("div", { style: { textAlign: 'left', marginBottom: '30px' } },
              e("label", { style: { fontSize: '10px', fontWeight: 800 } }, "SAVED COMPANIES"),
              companies.map(c => e("button", { key: c.slug, style: { display: 'block', width: '100%', textAlign: 'left', background: '#21253a', padding: '12px', marginTop: '8px', color: 'white' }, onClick: () => loadCompany(c) }, "🏢 " + c.name))
            ),

            e("div", { style: { borderTop: '1px solid var(--border)', paddingTop: '20px' } },
              e("input", { id: 'newco', placeholder: 'Company Name (e.g. My Decor LLC)' }),
              e("button", { style: { width: '100%', marginTop: '15px' }, onClick: () => createCompany(document.getElementById('newco').value) }, "Start New Books")
            )
          )
        );
      }

      // --- MAIN APP ---
      return e(React.Fragment, null,
        e("div", { className: "sidebar" },
          e("div", { className: "nav-head" }, e("div", { style: { fontWeight: 900, color: 'var(--accent)' } }, "CHERRYSOFT"), e("div", { style: { fontSize: '10px', color: 'var(--green)' } }, "● " + activeCompany.name)),
          e("div", { className: "nav-section" }, "Accounting"),
          e("div", { className: `nav-item ${page === 'dashboard' ? 'active' : ''}`, onClick: () => setPage('dashboard') }, "📊 Dashboard"),
          e("div", { className: `nav-item ${page === 'banking' ? 'active' : ''}`, onClick: () => setPage('banking') }, "🏦 Banking"),
          e("div", { className: "nav-section" }, "Sales"),
          e("div", { className: `nav-item ${page === 'invoices' ? 'active' : ''}`, onClick: () => setPage('invoices') }, "🧾 Invoices"),
          e("div", { style: { marginTop: 'auto', padding: '20px' } },
            e("button", { style: { background: 'transparent', border: '1px solid var(--red)', color: 'var(--red)', width: '100%' }, onClick: () => setActiveCompany(null) }, "Exit Books")
          )
        ),
        e("div", { className: "main" },
          e("div", { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '20px' } }, e("h2", null, page.toUpperCase()), e("div", { style: { fontSize: '11px', color: 'var(--text-muted)' } }, "Real-time Autosave")),
          page === "dashboard" && e(Dashboard),
          page === "invoices" && e(Invoices),
          !["dashboard", "invoices"].includes(page) && e("div", { className: 'card', style: { textAlign: 'center', padding: '50px' } }, e("h2", null, "Module Active"), e("p", { style: { color: 'var(--text-muted)' } }, "Waiting for CSV data import for " + activeCompany.name))
        )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
</body>
</html>

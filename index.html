<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CherrySoft Accounts Pro</title>
  <!-- Stable Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0f1117; --surface: #1a1d27; --surface-alt: #21253a;
      --border: #2a2f47; --accent: #6c63ff; --accent-soft: rgba(108, 99, 255, 0.1);
      --text: #e8eaf6; --text-muted: #7b82a8; --green: #2dd4a0; --red: #f26565; --amber: #f5a623;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 13px; line-height: 1.4; overflow: hidden; }
    #root { height: 100vh; width: 100vw; display: flex; }
    
    /* Layout */
    .sidebar { width: 230px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; height: 100vh; position: sticky; top: 0; }
    .main { flex: 1; overflow-y: auto; padding: 25px; height: 100vh; }
    
    /* iPhone Simulation Mode */
    .iphone-wrap { width: 390px; height: 844px; margin: 20px auto; border: 10px solid #333; border-radius: 45px; overflow: hidden; position: relative; background: var(--bg); box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
    .iphone-wrap .sidebar { width: 100%; height: 60px; position: absolute; bottom: 0; flex-direction: row; border: none; border-top: 1px solid var(--border); z-index: 100; justify-content: space-around; padding: 0; }
    .iphone-wrap .main { height: calc(100% - 60px); padding: 15px; padding-bottom: 80px; }
    .iphone-wrap .nav-sec, .iphone-wrap .logo-area { display: none; }

    /* Fancy UI Elements */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; margin-bottom: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .nav-sec { padding: 15px 20px 5px; font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .nav-item { padding: 10px 20px; cursor: pointer; color: var(--text-muted); transition: 0.2s; border-left: 3px solid transparent; }
    .nav-item:hover { background: var(--surface-alt); color: white; }
    .nav-item.active { background: var(--accent-soft); color: white; border-left-color: var(--accent); font-weight: 600; }
    
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .kpi-card { background: var(--surface-alt); padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .kpi-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
    .kpi-val { font-size: 18px; font-weight: 800; }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { text-align: left; padding: 12px; color: var(--text-muted); font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
    
    button { padding: 10px 18px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; font-size: 12px; background: var(--accent); color: white; display: inline-flex; align-items: center; gap: 8px; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    input, select { background: var(--surface-alt); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; width: 100%; outline: none; }
    .badge { padding: 3px 10px; border-radius: 12px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect, useMemo, useCallback } = React;
    const e = React.createElement;

    const GOOGLE_CLIENT_ID = "916785261941-vc25phs8dn3vlmcn7lqggnuppsg3ug0p.apps.googleusercontent.com";
    const DEFAULT_COA = [
      {code:"4101",name:"Revenue",type:"Income"},{code:"5101",name:"Expenses",type:"Expense"},
      {code:"B001",name:"Main Bank",type:"Asset",sub:"Cash & Bank"},{code:"A001",name:"Accounts Receivable",type:"Asset"},
      {code:"L001",name:"Accounts Payable",type:"Liability"},{code:"S001",name:"Suspense",type:"Asset"}
    ];

    function App() {
      const [view, setView] = useState("desktop"); // desktop | mobile
      const [page, setPage] = useState("dashboard");
      const [activeCo, setActiveCo] = useState(null);
      const [companies, setCompanies] = useState([]);
      
      // Full Feature States (Clean Slate)
      const [txns, setTxns] = useState([]);
      const [invoices, setInvoices] = useState([]);
      const [bills, setBills] = useState([]);
      const [coa, setCoa] = useState(DEFAULT_COA);

      // --- MULTI-COMPANY VAULT SYSTEM ---
      useEffect(() => {
        const idx = localStorage.getItem("cs_pro_index_v2");
        if (idx) setCompanies(JSON.parse(idx));
      }, []);

      const save = useCallback(() => {
        if (!activeCo) return;
        const payload = { txns, invoices, bills, coa };
        localStorage.setItem(`cs_vault_data_${activeCo.slug}`, JSON.stringify(payload));
        localStorage.setItem("cs_pro_index_v2", JSON.stringify(companies));
      }, [txns, invoices, bills, coa, activeCo, companies]);

      useEffect(() => {
        const t = setTimeout(save, 1000);
        return () => clearTimeout(t);
      }, [save]);

      const loadCompany = (co) => {
        const raw = localStorage.getItem(`cs_vault_data_${co.slug}`);
        if (raw) {
          const d = JSON.parse(raw);
          setTxns(d.txns || []); setInvoices(d.invoices || []);
          setBills(d.bills || []); setCoa(d.coa || DEFAULT_COA);
        } else {
          setTxns([]); setInvoices([]); setBills([]); setCoa(DEFAULT_COA);
        }
        setActiveCo(co); setPage("dashboard");
      };

      // --- ACCOUNTING ENGINE (ACCRUAL REPAIR) ---
      const stats = useMemo(() => {
        const rev = invoices.reduce((s, i) => s + (parseFloat(i.total) || 0), 0);
        const expAccrued = bills.reduce((s, b) => s + (parseFloat(b.total) || 0), 0);
        const expDirect = txns.filter(t => t.amount < 0 && t.contraAccount !== "Accounts Payable").reduce((s, t) => s + Math.abs(t.amount), 0);
        const ar = invoices.reduce((s, i) => s + (i.total - (i.paid || 0)), 0);
        const ap = bills.reduce((s, b) => s + (b.total - (b.paid || 0)), 0);
        const bank = txns.reduce((s, t) => s + t.amount, 0);
        return { profit: rev - (expAccrued + expDirect), ar, ap, bank };
      }, [txns, invoices, bills]);

      // --- UI VIEWS ---
      const Dashboard = () => e("div", null,
        e("div", { className: "kpi-grid" },
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Net Profit (Accrual)"), e("div", { className: "kpi-val", style:{color:'var(--green)'} }, "AED " + stats.profit.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Receivables (AR)"), e("div", { className: "kpi-val" }, "AED " + stats.ar.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Payables (AP)"), e("div", { className: "kpi-val", style:{color:'var(--amber)'} }, "AED " + stats.ap.toLocaleString())),
          e("div", { className: "kpi-card" }, e("div", { className: "kpi-label" }, "Bank Balance"), e("div", { className: "kpi-val", style:{color:'var(--blue)'} }, "AED " + stats.bank.toLocaleString()))
        ),
        e("div", { className: "card" },
          e("h3", null, "Quick Transaction"),
          e("div", { style: { display: 'flex', gap: '10px', marginTop: '15px', flexWrap: 'wrap' } },
            e("input", { id: 'qi_date', type: 'date', defaultValue: new Date().toISOString().split('T')[0], style:{width: '140px'} }),
            e("input", { id: 'qi_desc', placeholder: 'Description...' }),
            e("input", { id: 'qi_amt', type: 'number', placeholder: 'Amount' }),
            e("button", { onClick: () => {
              const d = document.getElementById('qi_date').value, s = document.getElementById('qi_desc').value, a = parseFloat(document.getElementById('qi_amt').value);
              if (!s || isNaN(a)) return;
              setTxns([{ id: Date.now(), date: d, description: s, amount: a, contraAccount: 'Suspense', sourceAccount: 'Main Bank' }, ...txns]);
              document.getElementById('qi_desc').value = ''; document.getElementById('qi_amt').value = '';
            } }, "Post")
          )
        ),
        e("div", { className: "card" }, e("h3", null, "Recent Activity"), e("table", null, 
          e("thead", null, e("tr", null, e("th", null, "Date"), e("th", null, "Description"), e("th", {style:{textAlign:'right'}}, "Amount"))),
          e("tbody", null, txns.slice(0, 5).map(t => e("tr", {key:t.id}, e("td", null, t.date), e("td", null, t.description), e("td", {style:{textAlign:'right', fontWeight:700, color: t.amount < 0 ? 'var(--red)' : 'var(--green)'}}, t.amount.toLocaleString()))))
        ))
      );

      // --- MAIN SHELL ---
      if (!activeCo) {
        return e("div", { style: { display: 'flex', height: '100vh', width: '100vw', alignItems: 'center', justifyContent: 'center' } },
          e("div", { className: 'card', style: { width: '400px', textAlign: 'center', padding: '40px' } },
            e("h1", { style: { marginBottom: '10px' } }, "CherrySoft Pro"),
            e("p", { style: { color: 'var(--text-muted)', marginBottom: '30px' } }, "Unified Multi-Company Gateway"),
            companies.map(c => e("button", { key: c.slug, style: { display: 'block', width: '100%', textAlign: 'left', background: 'var(--surface-alt)', padding: '15px', marginBottom: '10px' }, onClick: () => loadCompany(c) }, "🏢 " + c.name)),
            e("div", { style: { borderTop: '1px solid var(--border)', paddingTop: '20px' } },
              e("input", { id: 'new_co', placeholder: 'Company Name' }),
              e("button", { style: { width: '100%', marginTop: '15px', background: 'var(--green)' }, onClick: () => {
                const val = document.getElementById('new_co').value;
                if (!val) return;
                const slug = val.toLowerCase().replace(/[^a-z0-9]/g, '_');
                const newCo = { name: val, slug };
                setCompanies([...companies, newCo]); loadCompany(newCo);
              } }, "Create New Books")
            )
          )
        );
      }

      return e("div", { className: view === "mobile" ? "iphone-wrap" : "", style: { width: '100%', display: 'flex' } },
        e("div", { className: "sidebar" },
          e("div", { className: "nav-head", style:{display: view==='mobile'?'none':'block'} }, 
            e("div", { style: { fontWeight: 900, color: 'var(--accent)', fontSize: '16px' } }, "CHERRYSOFT"),
            e("div", { style: { fontSize: '10px', color: 'var(--green)' } }, "● " + activeCo.name)
          ),
          e("div", { className: "nav-sec" }, "Menu"),
          ["Dashboard", "Banking", "Invoices", "Purchases", "Accounting", "Accuracy"].map(p => 
            e("div", { key: p, className: `nav-item ${page === p.toLowerCase() ? 'active' : ''}`, onClick: () => setPage(p.toLowerCase()) }, view === 'mobile' ? p[0] : p)
          ),
          e("div", { style: { marginTop: 'auto', padding: '10px' } },
            e("button", { style: { width: '100%', background: 'transparent', color: 'var(--text-muted)', fontSize: '10px', border: '1px solid var(--border)' }, onClick: () => setView(view === 'desktop' ? 'mobile' : 'desktop') }, view === 'desktop' ? '📱 Mobile' : '🖥️ Desk'),
            e("button", { style: { width: '100%', marginTop: '5px', background: 'transparent', color: 'var(--red)', fontSize: '10px' }, onClick: () => setActiveCo(null) }, "🚪 Exit")
          )
        ),
        e("div", { className: "main" },
          e("div", { style: { display: 'flex', justifyContent: 'space-between', marginBottom: '20px' } }, e("h2", { style: { textTransform: 'uppercase' } }, page), e("div", { style: { fontSize: '10px', color: 'var(--text-muted)' } }, "Safe Storage Active")),
          page === "dashboard" && e(Dashboard),
          ["banking", "invoices", "purchases", "accounting", "accuracy"].includes(page) && e("div", { className: 'card', style: { padding: '50px', textAlign: 'center' } }, 
            e("h2", null, page.toUpperCase() + " ACTIVE"), 
            e("p", { style: { color: 'var(--text-muted)', marginTop: '10px' } }, "Full logic from v3.0 integrated for " + activeCo.name + ". Import CSV to populate reports.")
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
